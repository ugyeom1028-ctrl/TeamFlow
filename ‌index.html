<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeamFlow · 모던 협업 워크스페이스</title>
<!-- Supabase 클라이언트 SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-subtle: #f1f5f9;
  --ink-primary: #0f172a;
  --ink-secondary: #475569;
  --ink-muted: #94a3b8;
  --line: #e2e8f0;
  --line-strong: #cbd5e1;
  --primary: #2563eb;
  --primary-hover: #1d4ed8;
  --primary-soft: #eff6ff;
  --green: #10b981;
  --green-soft: #ecfdf5;
  --amber: #f59e0b;
  --amber-soft: #fffbeb;
  --red: #ef4444;
  --red-soft: #fef2f2;
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
  --shadow-card: 0 4px 6px -1px rgb(0 0 0 / 0.04), 0 2px 4px -2px rgb(0 0 0 / 0.04);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink-primary);
  font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; }
button { cursor: pointer; border: 0; }
a { color: inherit; text-decoration: none; }

.app-container { max-width: 1280px; margin: 0 auto; padding: 24px 20px 60px; }

/* Top Navigation Bar */
.top-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 18px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  margin-bottom: 24px;
  box-shadow: var(--shadow-sm);
}

.brand-section { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 38px; height: 38px;
  background: var(--primary);
  color: #fff;
  border-radius: 10px;
  display: grid; place-items: center;
  font-weight: 800; font-size: 19px;
  letter-spacing: -0.5px;
}
.brand-info h1 { font-size: 17px; font-weight: 700; margin: 0; }
.brand-info span { font-size: 12px; color: var(--ink-muted); }

.nav-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  font-weight: 600; font-size: 13px;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-secondary);
  transition: all 0.15s ease;
}
.btn:hover { background: var(--surface-subtle); color: var(--ink-primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); }
.btn.sm { padding: 6px 10px; font-size: 12px; }
.btn.danger { color: var(--red); }
.btn.danger:hover { background: var(--red-soft); }

.user-badge {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px;
  background: var(--surface-subtle);
  border: 1px solid var(--line);
  border-radius: 20px;
  font-size: 13px; font-weight: 600;
}
.user-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: grid; place-items: center; font-size: 11px; font-weight: 800;
}

/* Workspace Header */
.workspace-header {
  display: flex; align-items: flex-start; justify-content: space-between;
  gap: 16px; margin-bottom: 24px; flex-wrap: wrap;
}
.workspace-title-area h2 { font-size: 26px; font-weight: 800; margin: 0 0 6px; letter-spacing: -0.6px; }
.workspace-meta { font-size: 13px; color: var(--ink-muted); display: flex; align-items: center; gap: 8px; }
.share-pill {
  background: var(--primary-soft); color: var(--primary);
  padding: 4px 10px; border-radius: 20px; font-weight: 600; cursor: pointer;
  border: 1px solid #bfdbfe; font-size: 12px;
}

/* Tabs */
.view-tabs {
  display: flex; gap: 6px; padding: 4px;
  background: #e2e8f0; border-radius: 10px; width: max-content; margin-bottom: 24px;
}
.tab-btn {
  padding: 7px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
  color: var(--ink-secondary); background: transparent; transition: all 0.15s ease;
}
.tab-btn.active { background: #fff; color: var(--ink-primary); box-shadow: var(--shadow-sm); }

/* Dashboard Grid */
.stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 24px; }
.stat-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 18px; box-shadow: var(--shadow-card);
}
.stat-card .label { font-size: 12px; font-weight: 600; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.5px; }
.stat-card .val { font-size: 28px; font-weight: 800; margin: 6px 0 2px; }
.stat-card .desc { font-size: 12px; color: var(--ink-muted); }

.layout-cols { display: grid; grid-template-columns: 1.35fr 0.85fr; gap: 18px; margin-bottom: 24px; }
.content-box {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-md); padding: 20px; box-shadow: var(--shadow-card);
}
.box-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.box-header h3 { font-size: 16px; font-weight: 700; margin: 0; }

.task-stack { display: grid; gap: 8px; }
.task-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: #fff;
  border: 1px solid var(--line); border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.15s ease;
}
.task-item:hover { border-color: var(--line-strong); box-shadow: var(--shadow-card); transform: translateY(-1px); }
.task-item-main { flex: 1; min-width: 0; }
.task-item-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-item-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

/* Status Badges */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: 700;
  background: var(--surface-subtle); color: var(--ink-secondary);
}
.badge.done { background: var(--green-soft); color: var(--green); }
.badge.doing { background: var(--primary-soft); color: var(--primary); }
.badge.review { background: #f3e8ff; color: #9333ea; }
.badge.blocked, .badge.overdue { background: var(--red-soft); color: var(--red); }
.badge.attachment { background: #f1f5f9; color: #475569; font-weight: 600; }

/* Project Map Canvas */
.map-container {
  background: #f8fafc; border: 1px solid var(--line); border-radius: var(--radius-md);
  min-height: 440px; overflow: auto; position: relative; padding: 24px;
}
.map-inner { position: relative; min-width: max-content; }
.map-stages { display: grid; grid-auto-flow: column; grid-auto-columns: 240px; gap: 54px; position: relative; z-index: 2; }
.map-stage-col h4 {
  font-size: 12px; font-weight: 700; color: var(--ink-muted); text-transform: uppercase;
  margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
.map-card {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 12px; margin-bottom: 10px; cursor: pointer; box-shadow: var(--shadow-sm);
  transition: all 0.15s ease;
}
.map-card:hover { border-color: var(--primary); box-shadow: var(--shadow-card); }
.map-card .title { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
.map-card .meta { font-size: 11px; color: var(--ink-muted); display: flex; justify-content: space-between; }

/* Lobby View (No Project Selected) */
.lobby-screen {
  min-height: 80vh; display: grid; place-items: center; text-align: center;
}
.lobby-card {
  background: #fff; border: 1px solid var(--line); border-radius: var(--radius-lg);
  padding: 40px 32px; max-width: 480px; width: 100%; box-shadow: var(--shadow-card);
}
.lobby-card h2 { font-size: 24px; font-weight: 800; margin: 0 0 10px; }
.lobby-card p { font-size: 14px; color: var(--ink-muted); margin: 0 0 28px; }
.form-input {
  width: 100%; padding: 11px 13px; border: 1px solid var(--line);
  border-radius: var(--radius-sm); font-size: 14px; margin-bottom: 14px; outline: none;
}
.form-input:focus { border-color: var(--primary); ring: 2px solid var(--primary-soft); }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(4px); z-index: 50; place-items: center; padding: 20px;
}
.modal-overlay.open { display: grid; }
.modal-card {
  background: #fff; border-radius: var(--radius-lg); max-width: 620px; width: 100%;
  max-height: 90vh; overflow-y: auto; padding: 26px; box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.15);
}
.modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
.modal-header h3 { font-size: 19px; font-weight: 800; margin: 0; }
.close-btn { background: none; font-size: 22px; color: var(--ink-muted); padding: 0; }

.drop-area {
  border: 2px dashed var(--line-strong); border-radius: var(--radius-sm);
  padding: 16px; text-align: center; font-size: 12px; color: var(--ink-muted);
  cursor: pointer; margin-top: 8px; background: var(--surface-subtle);
}
.drop-area:hover { border-color: var(--primary); background: var(--primary-soft); }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(30px);
  background: var(--ink-primary); color: #fff; padding: 10px 18px; border-radius: 30px;
  font-size: 13px; font-weight: 600; opacity: 0; transition: all 0.2s ease; z-index: 100; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@media(max-width: 768px) {
  .stat-row { grid-template-columns: 1fr; }
  .layout-cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="app"></div>
<div class="toast" id="toast"></div>

<!-- 업무 추가 / 상세 모달 창 -->
<div class="modal-overlay" id="mainModal"><div class="modal-card" id="modalContent"></div></div>

<script>
(()=>{
  // Supabase 클라이언트 세팅
  const SUPABASE_URL = 'https://etpkmddranmbseymkllb.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0cGttZGRyYW5tYnNleW1rbGxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjMxNDksImV4cCI6MjEwODQzOTE0OX0.4NbOzaf3vw-VTg9YOciYj_UmmKTmnMDs_CtlX6pK4t8';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  // URL에서 프로젝트 ID 추출 (?p=xxx)
  const urlParams = new URLSearchParams(window.location.search);
  const projectId = urlParams.get('p');

  let currentProject = null;
  let currentMembers = [];
  let currentTasks = [];
  let currentUser = localStorage.getItem('teamflow_user') || '';
  let activeTab = 'dashboard';

  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(toast.timer);
    toast.timer = setTimeout(()=> el.classList.remove('show'), 2400);
  }

  // 1. 프로젝트 로비 화면 (URL에 프로젝트 ID가 없을 때)
  function renderLobby(){
    document.getElementById('app').innerHTML = `
      <div class="lobby-screen">
        <div class="lobby-card">
          <div style="font-size:36px;margin-bottom:12px">⚡</div>
          <h2>새 팀플 워크스페이스 시작하기</h2>
          <p>팀 프로젝트 이름을 정하고 바로 공유 가능한 링크를 만드세요.</p>
          <input id="newProjectName" class="form-input" placeholder="예: 캡스톤 디자인 3조">
          <input id="creatorName" class="form-input" placeholder="내 이름 또는 닉네임 (예: 유겸)">
          <button class="btn primary" style="width:100%;padding:12px;font-size:14px" onclick="createProject()">
            워크스페이스 개설하기 →
          </button>
        </div>
      </div>
    `;
  }

  window.createProject = async function(){
    const name = document.getElementById('newProjectName').value.trim();
    const creator = document.getElementById('creatorName').value.trim();
    if(!name || !creator){ toast('프로젝트 이름과 닉네임을 모두 적어주세요.'); return; }

    const id = 'tf-' + Math.random().toString(36).substring(2, 8);
    toast('프로젝트 공간 생성 중...');

    // 1. Projects 테이블 등록
    const { error: pErr } = await supabase.from('projects').insert([{ id, name, created_by: creator }]);
    if(pErr){ console.error(pErr); toast('생성 실패: ' + pErr.message); return; }

    // 2. 개설자를 Leader로 등록
    await supabase.from('members').insert([{ project_id: id, name: creator, role: 'leader' }]);
    localStorage.setItem('teamflow_user', creator);

    // 고유 링크로 페이지 이동
    window.location.href = `?p=${id}`;
  };

  // 2. 프로젝트 데이터 로드
  async function loadProject(){
    // 프로젝트 정보 조회
    const { data: pData, error: pErr } = await supabase.from('projects').select('*').eq('id', projectId).single();
    if(pErr || !pData){
      alert('존재하지 않거나 삭제된 프로젝트입니다.');
      window.location.href = window.location.pathname;
      return;
    }
    currentProject = pData;

    // 팀원 목록 조회
    const { data: mData } = await supabase.from('members').select('*').eq('project_id', projectId);
    currentMembers = mData || [];

    // 접속자가 처음 온 팀원이면 닉네임 등록 팝업
    if(!currentUser || !currentMembers.some(m => m.name === currentUser)){
      promptJoinMember();
      return;
    }

    // 업무 목록 조회
    await fetchTasks();
    renderWorkspace();
  }

  function promptJoinMember(){
    const name = prompt(`'${currentProject.name}' 팀플에 합류합니다!\n사용할 이름을 입력해 주세요:`, currentUser || '');
    if(!name || !name.trim()){
      alert('이름을 입력해야 워크스페이스에 참여할 수 있습니다.');
      window.location.reload();
      return;
    }
    const cleanName = name.trim();
    currentUser = cleanName;
    localStorage.setItem('teamflow_user', currentUser);

    // 팀원 추가 등록
    supabase.from('members').insert([{ project_id: projectId, name: currentUser, role: 'member' }])
      .then(()=>{ loadProject(); });
  }

  async function fetchTasks(){
    const { data } = await supabase.from('tasks').select('*').eq('project_id', projectId);
    currentTasks = data || [];
  }

  // 3. 메인 워크스페이스 렌더링
  function renderWorkspace(){
    const total = currentTasks.length;
    const done = currentTasks.filter(t => t.status === 'done').length;
    const attention = currentTasks.filter(t => t.status === 'review' || t.status === 'blocked').length;

    document.getElementById('app').innerHTML = `
      <div class="app-container">
        <!-- Top Nav -->
        <header class="top-nav">
          <div class="brand-section">
            <div class="brand-logo">T</div>
            <div class="brand-info">
              <h1>TeamFlow</h1>
              <span>Cloud Realtime SaaS</span>
            </div>
          </div>
          <div class="nav-controls">
            <div class="user-badge">
              <div class="user-avatar">${currentUser[0]}</div>
              <span>${currentUser}</span>
            </div>
            <button class="btn sm" onclick="changeUser()">계정 전환</button>
            <button class="btn sm primary" onclick="openAddTaskModal()">＋ 업무 추가</button>
          </div>
        </header>

        <!-- Workspace Header -->
        <div class="workspace-header">
          <div class="workspace-title-area">
            <h2>${currentProject.name}</h2>
            <div class="workspace-meta">
              <span>팀원: ${currentMembers.map(m=>m.name).join(', ')}</span>
              <span>·</span>
              <span class="share-pill" onclick="copyShareLink()">🔗 초대 링크 복사</span>
            </div>
          </div>
          <button class="btn sm" onclick="window.location.href=window.location.pathname">새 팀플 만들기</button>
        </div>

        <!-- View Tabs -->
        <div class="view-tabs">
          <button class="tab-btn ${activeTab==='dashboard'?'active':''}" onclick="switchTab('dashboard')">대시보드 현황</button>
          <button class="tab-btn ${activeTab==='map'?'active':''}" onclick="switchTab('map')">프로젝트 맵</button>
        </div>

        <main id="tabContent"></main>
      </div>
    `;

    if(activeTab === 'dashboard') renderDashboardView(total, done, attention);
    else renderMapView();
  }

  window.switchTab = function(tab){
    activeTab = tab;
    renderWorkspace();
  };

  window.copyShareLink = function(){
    navigator.clipboard.writeText(window.location.href);
    toast('초대 링크가 복사되었습니다! 팀원들에게 전달하세요.');
  };

  window.changeUser = function(){
    const next = prompt('전환할 닉네임을 입력하세요:', currentUser);
    if(next && next.trim()){
      currentUser = next.trim();
      localStorage.setItem('teamflow_user', currentUser);
      loadProject();
    }
  };

  // 대시보드 뷰
  function renderDashboardView(total, done, attention){
    const mine = currentTasks.filter(t => t.assignee === currentUser && t.status !== 'done');
    const myHTML = mine.length ? mine.map(taskItemHTML).join('') : '<div style="font-size:13px;color:var(--ink-muted);padding:14px 0">내가 맡은 미완료 업무가 없습니다.</div>';
    const allHTML = currentTasks.length ? currentTasks.map(taskItemHTML).join('') : '<div style="font-size:13px;color:var(--ink-muted);padding:14px 0">등록된 업무가 없습니다. 우측 상단에서 새 업무를 추가해보세요.</div>';

    document.getElementById('tabContent').innerHTML = `
      <div class="stat-row">
        <div class="stat-card">
          <div class="label">전체 진행 업무</div>
          <div class="val">${total}</div>
          <div class="desc">프로젝트 전체 태스크</div>
        </div>
        <div class="stat-card">
          <div class="label">완료된 업무</div>
          <div class="val" style="color:var(--green)">${done}</div>
          <div class="desc">완료율: ${total ? Math.round(done/total*100) : 0}%</div>
        </div>
        <div class="stat-card">
          <div class="label">검토 및 이슈</div>
          <div class="val" style="color:var(--amber)">${attention}</div>
          <div class="desc">승인 대기 또는 차단 항목</div>
        </div>
      </div>

      <div class="layout-cols">
        <section class="content-box">
          <div class="box-header">
            <h3>내 할 일 (${mine.length})</h3>
          </div>
          <div class="task-stack">${myHTML}</div>
        </section>
        <section class="content-box">
          <div class="box-header">
            <h3>전체 업무 타임라인</h3>
          </div>
          <div class="task-stack">${allHTML}</div>
        </section>
      </div>
    `;
  }

  function taskItemHTML(t){
    const statusText = { todo: '시작 전', doing: '진행 중', review: '검토 대기', done: '완료', blocked: '차단됨' };
    const fileCount = (t.files ? t.files.length : 0) + (t.links ? t.links.length : 0);
    const badgeHTML = fileCount > 0 ? `<span class="badge attachment">📎 ${fileCount}</span>` : '';
    return `
      <div class="task-item" onclick="openTaskDetailModal('${t.id}')">
        <div class="task-item-main">
          <div class="task-item-title">${escapeHTML(t.title)}</div>
          <div class="task-item-sub">${escapeHTML(t.assignee)} · 마감: ${t.due_date || '미정'}</div>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${badgeHTML}
          <span class="badge ${t.status}">${statusText[t.status] || t.status}</span>
        </div>
      </div>
    `;
  }

  // 프로젝트 맵 뷰 (단계별 시각화)
  function renderMapView(){
    document.getElementById('tabContent').innerHTML = `
      <div class="map-container">
        <div class="map-inner">
          <div class="map-stages" id="mapStages"></div>
        </div>
      </div>
    `;
    const stagesEl = document.getElementById('mapStages');
    const cols = ['1단계: 기초 작업', '2단계: 분석 및 작성', '3단계: 제작 및 취합', '4단계: 최종 검토'];
    
    cols.forEach((colTitle, idx) => {
      const colDiv = document.createElement('div');
      colDiv.className = 'map-stage-col';
      const colTasks = currentTasks.filter((_, tIdx) => (tIdx % 4) === idx);
      const cardsHTML = colTasks.length ? colTasks.map(t => `
        <div class="map-card" onclick="openTaskDetailModal('${t.id}')">
          <div class="title">${escapeHTML(t.title)}</div>
          <div class="meta">
            <span>${escapeHTML(t.assignee)}</span>
            <span class="badge ${t.status}" style="font-size:10px">${t.status}</span>
          </div>
        </div>
      `).join('') : '<div style="font-size:12px;color:var(--ink-muted)">업무 없음</div>';

      colDiv.innerHTML = `<h4>${colTitle}</h4><div>${cardsHTML}</div>`;
      stagesEl.appendChild(colDiv);
    });
  }

  // 모달 제어
  function openModal(html){
    document.getElementById('modalContent').innerHTML = html;
    document.getElementById('mainModal').classList.add('open');
  }
  window.closeModal = function(){
    document.getElementById('mainModal').classList.remove('open');
  };

  // 업무 추가 모달
  window.openAddTaskModal = function(){
    const memberOpts = currentMembers.map(m => `<option value="${m.name}" ${m.name===currentUser?'selected':''}>${m.name}</option>`).join('');
    openModal(`
      <div class="modal-header">
        <h3>새 업무 추가</h3>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>
      <div>
        <label style="font-size:12px;font-weight:700">업무 이름</label>
        <input id="newTaskTitle" class="form-input" placeholder="예: 시장 조사 자료 취합">

        <label style="font-size:12px;font-weight:700">설명 및 완료 조건</label>
        <textarea id="newTaskDesc" class="form-input" style="min-height:70px" placeholder="어디까지 완료해야 하는지 적어주세요."></textarea>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
          <div>
            <label style="font-size:12px;font-weight:700">담당자</label>
            <select id="newTaskAssignee" class="form-input">${memberOpts}</select>
          </div>
          <div>
            <label style="font-size:12px;font-weight:700">마감일</label>
            <input type="date" id="newTaskDueDate" class="form-input">
          </div>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:16px">
          <button class="btn" onclick="closeModal()">취소</button>
          <button class="btn primary" onclick="submitNewTask()">업무 등록하기</button>
        </div>
      </div>
    `);
  };

  window.submitNewTask = async function(){
    const title = document.getElementById('newTaskTitle').value.trim();
    if(!title){ toast('업무 이름을 적어주세요.'); return; }
    const description = document.getElementById('newTaskDesc').value.trim();
    const assignee = document.getElementById('newTaskAssignee').value;
    const due_date = document.getElementById('newTaskDueDate').value;

    const id = 'task-' + Math.random().toString(36).substring(2, 9);
    toast('업무 등록 중...');

    const { error } = await supabase.from('tasks').insert([{
      id, project_id: projectId, title, description, assignee, due_date, status: 'todo'
    }]);

    if(error){ toast('등록 실패: ' + error.message); return; }
    closeModal();
    await fetchTasks();
    renderWorkspace();
    toast('업무가 등록되었습니다.');
  };

  // 업무 상세 & 파일/링크 모달 (담당자 전용 제어)
  window.openTaskDetailModal = function(taskId){
    const t = currentTasks.find(x => x.id === taskId);
    if(!t) return;
    const isAssignee = (currentUser === t.assignee);

    const filesHTML = (t.files && t.files.length) ? t.files.map((f, i) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;margin-top:6px;font-size:13px">
        <span>📄 <strong>${escapeHTML(f.name)}</strong></span>
        <div style="display:flex;gap:6px">
          <a href="${f.url}" target="_blank" download class="btn sm">다운로드</a>
          ${isAssignee ? `<button class="btn sm danger" onclick="deleteTaskFile('${t.id}', ${i})">삭제</button>` : ''}
        </div>
      </div>
    `).join('') : '<div style="font-size:12px;color:var(--ink-muted);margin:4px 0">등록된 문서가 없습니다.</div>';

    const linksHTML = (t.links && t.links.length) ? t.links.map((l, i) => `
      <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;margin-top:6px;font-size:13px">
        <span>🔗 <a href="${l.url}" target="_blank" style="color:var(--primary);font-weight:600">${escapeHTML(l.title || l.url)}</a></span>
        ${isAssignee ? `<button class="btn sm danger" onclick="deleteTaskLink('${t.id}', ${i})">삭제</button>` : ''}
      </div>
    `).join('') : '<div style="font-size:12px;color:var(--ink-muted);margin:4px 0">등록된 링크가 없습니다.</div>';

    const uploadZoneHTML = isAssignee ? `
      <div class="drop-area" onclick="document.getElementById('fileUploadInput').click()">
        📁 <strong>여기를 클릭해 파일을 다중 선택하거나 드래그해 놓으세요</strong>
        <div style="font-size:11px;margin-top:2px">PPT, PDF, 한글, 이미지 등 여러 개 동시 선택 가능</div>
      </div>
      <input type="file" id="fileUploadInput" multiple style="display:none" onchange="uploadMultipleFiles('${t.id}', this.files)">

      <div style="margin-top:12px">
        <textarea id="bulkLinkInput" class="form-input" style="min-height:55px;font-size:12px" placeholder="여러 링크를 한 줄에 하나씩 붙여넣으세요 (예: 구글슬라이드: https://...)"></textarea>
        <button class="btn sm primary" style="width:100%" onclick="submitBulkLinks('${t.id}')">링크 한 번에 등록</button>
      </div>
    ` : `<div style="font-size:12px;color:var(--ink-muted);margin-top:8px">※ 결과물 등록은 담당자(${escapeHTML(t.assignee)})만 가능합니다.</div>`;

    openModal(`
      <div class="modal-header">
        <div>
          <h3>${escapeHTML(t.title)}</h3>
          <div style="font-size:12px;color:var(--ink-muted);margin-top:4px">담당자: ${escapeHTML(t.assignee)} · 상태: ${t.status}</div>
        </div>
        <button class="close-btn" onclick="closeModal()">×</button>
      </div>

      <p style="font-size:14px;color:var(--ink-secondary);margin:0 0 16px">${escapeHTML(t.description || '상세 설명이 없습니다.')}</p>

      <div style="background:#f1f5f9;border-radius:10px;padding:14px;margin-bottom:16px">
        <div style="font-weight:700;font-size:13px;margin-bottom:6px">📦 결과물 (파일 / 링크)</div>
        <div style="font-size:12px;font-weight:600;margin-top:8px">첨부 파일</div>
        ${filesHTML}
        <div style="font-size:12px;font-weight:600;margin-top:12px">협업 링크</div>
        ${linksHTML}
        ${uploadZoneHTML}
      </div>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px">
        <div style="display:flex;gap:6px">
          ${t.status !== 'done' ? `<button class="btn sm primary" onclick="updateTaskStatus('${t.id}', 'done')">✓ 완료 처리</button>` : `<button class="btn sm" onclick="updateTaskStatus('${t.id}', 'doing')">다시 진행</button>`}
          ${t.status !== 'blocked' ? `<button class="btn sm" onclick="updateTaskStatus('${t.id}', 'blocked')">차단 표시</button>` : `<button class="btn sm" onclick="updateTaskStatus('${t.id}', 'doing')">차단 해제</button>`}
        </div>
        <button class="btn sm danger" onclick="deleteTask('${t.id}')">업무 삭제</button>
      </div>
    `);
  };

  // 다중 파일 업로드
  window.uploadMultipleFiles = async function(taskId, fileList){
    if(!fileList || !fileList.length) return;
    const task = currentTasks.find(x => x.id === taskId);
    toast(`${fileList.length}개 파일 업로드 중...`);

    const newFiles = task.files ? [...task.files] : [];
    for(const file of Array.from(fileList)){
      const ext = file.name.split('.').pop();
      const path = `${projectId}/${taskId}_${Date.now()}_${Math.random().toString(36).slice(2,6)}.${ext}`;
      const { error } = await supabase.storage.from('attachments').upload(path, file);
      if(!error){
        const { data: urlData } = supabase.storage.from('attachments').getPublicUrl(path);
        newFiles.push({ name: file.name, url: urlData.publicUrl, path });
      }
    }

    await supabase.from('tasks').update({ files: newFiles }).eq('id', taskId);
    await fetchTasks();
    openTaskDetailModal(taskId);
    toast('파일 업로드가 완료되었습니다.');
  };

  // 파일 삭제
  window.deleteTaskFile = async function(taskId, idx){
    const task = currentTasks.find(x => x.id === taskId);
    const newFiles = [...task.files];
    newFiles.splice(idx, 1);
    await supabase.from('tasks').update({ files: newFiles }).eq('id', taskId);
    await fetchTasks();
    openTaskDetailModal(taskId);
    toast('파일이 삭제되었습니다.');
  };

  // 일괄 링크 등록
  window.submitBulkLinks = async function(taskId){
    const text = document.getElementById('bulkLinkInput').value.trim();
    if(!text) return;
    const task = currentTasks.find(x => x.id === taskId);
    const newLinks = task.links ? [...task.links] : [];

    text.split('\n').map(l => l.trim()).filter(Boolean).forEach(line => {
      let title = '';
      let url = line;
      const idx = line.indexOf('http');
      if(idx > 0){
        title = line.slice(0, idx).replace(/[:\-]/g, '').trim();
        url = line.slice(idx).trim();
      }
      if(!url.startsWith('http')) url = 'https://' + url;
      newLinks.push({ title: title || url, url });
    });

    await supabase.from('tasks').update({ links: newLinks }).eq('id', taskId);
    await fetchTasks();
    openTaskDetailModal(taskId);
    toast('링크가 등록되었습니다.');
  };

  // 링크 삭제
  window.deleteTaskLink = async function(taskId, idx){
    const task = currentTasks.find(x => x.id === taskId);
    const newLinks = [...task.links];
    newLinks.splice(idx, 1);
    await supabase.from('tasks').update({ links: newLinks }).eq('id', taskId);
    await fetchTasks();
    openTaskDetailModal(taskId);
    toast('링크가 삭제되었습니다.');
  };

  // 상태 변경 및 삭제
  window.updateTaskStatus = async function(taskId, status){
    await supabase.from('tasks').update({ status }).eq('id', taskId);
    closeModal();
    await fetchTasks();
    renderWorkspace();
    toast('업무 상태가 변경되었습니다.');
  };

  window.deleteTask = async function(taskId){
    if(!confirm('이 업무를 완전히 삭제하시겠습니까?')) return;
    await supabase.from('tasks').delete().eq('id', taskId);
    closeModal();
    await fetchTasks();
    renderWorkspace();
    toast('업무가 삭제되었습니다.');
  };

  function escapeHTML(s=''){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // 진입점
  if(!projectId){
    renderLobby();
  } else {
    loadProject();
  }
})();
</script>
</body>
</html>
