<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamFlow — 대학생을 위한 스마트 워크스페이스</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; }
    body { background-color: #0b0f17; color: #e2e8f0; }
    .glass-panel { background: rgba(18, 24, 38, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-card { background: rgba(26, 34, 52, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); transition: all 0.2s ease; }
    .glass-card:hover { transform: translateY(-2px); border-color: rgba(99, 102, 241, 0.4); box-shadow: 0 8px 24px -4px rgba(0, 0, 0, 0.4); }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(71, 85, 105, 0.5); border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.5); }
    .badge-todo { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
    .badge-in_progress { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-review { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-done { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- 네비게이션 헤더 -->
  <header id="mainHeader" class="sticky top-0 z-40 border-b border-slate-800/80 bg-slate-950/70 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
          <i class="fa-solid fa-cubes-stacked text-white text-base"></i>
        </div>
        <div class="flex items-center gap-2">
          <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">TeamFlow</span>
          <span id="headerProjectTitle" class="text-sm font-medium text-slate-400 pl-2 border-l border-slate-700/60 hidden"></span>
        </div>
      </div>

      <div id="headerActions" class="flex items-center gap-2.5 hidden">
        <button onclick="openInviteModal()" class="px-3 py-1.5 rounded-lg text-xs font-medium text-indigo-300 bg-indigo-500/10 hover:bg-indigo-500/20 border border-indigo-500/30 transition flex items-center gap-1.5">
          <i class="fa-solid fa-user-plus text-[11px]"></i> 팀원 초대
        </button>
        <div class="h-4 w-[1px] bg-slate-800 mx-1"></div>
        <div id="userBadge" class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-900 border border-slate-800 text-xs text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="currentUserName">팀원</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 메인 뷰포트 영역 -->
  <main id="appContainer" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex flex-col">
    <!-- 동적 렌더링 영역 (로비 / 온보딩 / 대시보드) -->
  </main>

  <!-- 업무 생성 모달 -->
  <div id="createTaskModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-lg rounded-2xl p-6 shadow-2xl relative">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <h3 class="text-base font-semibold text-white flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-indigo-400"></i> 새 업무 생성
        </h3>
        <button onclick="closeModal('createTaskModal')" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form id="createTaskForm" onsubmit="handleCreateTask(event)" class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">업무명 *</label>
          <input type="text" id="taskTitleInput" required placeholder="예: 선행 논문 요약 및 인터뷰 질문지 작성" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">상세 설명</label>
          <textarea id="taskDescInput" rows="3" placeholder="업무의 세부 요구사항이나 참고할 내용을 기록하세요" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition"></textarea>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">담당자 배정</label>
            <select id="taskAssigneeSelect" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
              <option value="">미정 (나중에 지정)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">마감 기한</label>
            <input type="date" id="taskDueDateInput" class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
          </div>
        </div>
        <div class="pt-3 flex justify-end gap-2 border-t border-slate-800">
          <button type="button" onclick="closeModal('createTaskModal')" class="px-4 py-2 text-xs font-medium text-slate-400 hover:text-white transition">취소</button>
          <button type="submit" id="createTaskSubmitBtn" class="px-4 py-2 text-xs font-medium text-white bg-indigo-600 hover:bg-indigo-500 rounded-xl transition shadow-lg shadow-indigo-600/30">등록하기</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 업무 상세 및 결과물 모달 -->
  <div id="taskDetailModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-2xl rounded-2xl p-6 shadow-2xl relative max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800">
        <div class="flex items-center gap-2.5">
          <span id="modalTaskStatusBadge" class="text-xs px-2.5 py-1 rounded-full font-medium">대기</span>
          <h3 id="modalTaskTitle" class="text-base font-semibold text-white"></h3>
        </div>
        <button onclick="closeModal('taskDetailModal')" class="text-slate-400 hover:text-white transition"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="flex-1 overflow-y-auto custom-scroll py-4 space-y-6">
        <!-- 메타 정보 영역 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 p-3.5 rounded-xl bg-slate-900/50 border border-slate-800/80 text-xs">
          <div>
            <div class="text-slate-500 mb-1">담당자</div>
            <select id="modalAssigneeSelect" onchange="handleAssigneeChange(event)" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="">미정</option>
            </select>
          </div>
          <div>
            <div class="text-slate-500 mb-1">마감 기한</div>
            <div id="modalTaskDueDate" class="text-slate-300 font-medium pt-1">미설정</div>
          </div>
          <div>
            <div class="text-slate-500 mb-1">상태 변경</div>
            <select id="modalStatusSelect" onchange="handleStatusChange(event)" class="bg-slate-950 border border-slate-700 rounded-lg px-2 py-1 text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="todo">대기</option>
              <option value="in_progress">진행 중</option>
              <option value="review">검토 요청</option>
              <option value="done">완료됨</option>
            </select>
          </div>
        </div>

        <div>
          <h4 class="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wider">업무 설명</h4>
          <p id="modalTaskDesc" class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap bg-slate-900/30 p-3.5 rounded-xl border border-slate-800/50"></p>
        </div>

        <!-- 결과물 등록 (다중 파일 및 링크) -->
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">산출물 & 참고 링크</h4>
            <span id="assigneeOnlyNotice" class="text-[11px] text-amber-400/80 hidden"><i class="fa-solid fa-shield-halved"></i> 담당자 전용 수정 모드</span>
          </div>

          <!-- 파일 첨부 폼 (담당자 전용) -->
          <div id="uploadSection" class="p-4 rounded-xl bg-slate-900/60 border border-slate-800 space-y-3">
            <div class="flex flex-col sm:flex-row gap-2">
              <input type="file" id="fileInputBatch" multiple class="block w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-medium file:bg-indigo-600/30 file:text-indigo-300 hover:file:bg-indigo-600/50 cursor-pointer">
              <button onclick="handleBatchFileUpload()" id="fileUploadBtn" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 transition flex items-center justify-center gap-1.5 whitespace-nowrap">
                <i class="fa-solid fa-cloud-arrow-up"></i> 파일 일괄 업로드
              </button>
            </div>
            <div class="flex gap-2">
              <input type="text" id="linkTitleInput" placeholder="링크 제목 (예: 피그마, 노션)" class="w-1/3 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
              <input type="url" id="linkUrlInput" placeholder="https://..." class="flex-1 bg-slate-950 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
              <button onclick="handleAddLink()" class="px-3.5 py-1.5 rounded-lg text-xs font-medium bg-slate-800 hover:bg-slate-700 text-white border border-slate-700 transition whitespace-nowrap">
                링크 추가
              </button>
            </div>
          </div>

          <!-- 첨부 결과물 목록 -->
          <div class="space-y-2">
            <div id="modalFilesList" class="space-y-1.5"></div>
            <div id="modalLinksList" class="space-y-1.5"></div>
          </div>
        </div>
      </div>

      <div class="pt-4 border-t border-slate-800 flex justify-between items-center">
        <button onclick="handleDeleteTask()" class="text-xs text-rose-400 hover:text-rose-300 px-3 py-1.5 rounded-lg hover:bg-rose-500/10 transition">
          <i class="fa-regular fa-trash-can mr-1"></i> 업무 삭제
        </button>
        <button onclick="closeModal('taskDetailModal')" class="px-4 py-2 text-xs font-medium bg-slate-800 hover:bg-slate-700 text-white rounded-xl transition">닫기</button>
      </div>
    </div>
  </div>

  <!-- 초대 모달 -->
  <div id="inviteModal" class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl p-6 shadow-2xl relative">
      <div class="flex items-center justify-between pb-3 border-b border-slate-800">
        <h3 class="text-sm font-semibold text-white flex items-center gap-2">
          <i class="fa-solid fa-link text-indigo-400"></i> 팀원 초대 링크
        </h3>
        <button onclick="closeModal('inviteModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div class="mt-4 space-y-4">
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">초대 링크 (URL)</label>
          <div class="flex gap-2">
            <input type="text" id="inviteUrlField" readonly class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-300 font-mono select-all">
            <button onclick="copyInviteUrl()" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center gap-1.5 whitespace-nowrap">
              <i class="fa-regular fa-copy"></i> 복사
            </button>
          </div>
        </div>
        <div class="p-3 rounded-xl bg-slate-900/60 border border-slate-800/80 text-xs text-slate-400 flex items-center justify-between">
          <span>프로젝트 코드:</span>
          <span id="inviteCodeField" class="font-mono text-indigo-300 font-semibold text-sm"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- 알림 토스트 UI -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2 transition-all duration-300 opacity-0 pointer-events-none transform translate-y-2"></div>

<script>
    // ==========================================
    // Supabase 클라이언트 초기화 (전역 네임스페이스 충돌 방지)
    // ==========================================
    const SUPABASE_URL = 'https://ugyeom1028-ctrl.supabase.co'; 
    // 사용 중이신 실제 anon key가 있다면 교체해 주세요.
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVneWVvbTEwMjgtY3RybCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzM1MDAwMDAwLCJleHAiOjIwNTAwMDAwMDB9.EXAMPLE_KEY';
    
    let sbClient = null;
    try {
      if (window.supabase) {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) {
      console.warn("Supabase Init Alert:", e);
    }

    // 전역 상태 관리
    let currentProjectId = new URLSearchParams(window.location.search).get('p');
    let currentProject = null;
    let currentMembers = [];
    let currentTasks = [];
    let activeTask = null;
    let currentUserId = localStorage.getItem('teamflow_user_id') || null;
    let currentUserName = localStorage.getItem('teamflow_user_name') || null;

    // ==========================================
    // 앱 초기 실행 진입점
    // ==========================================
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        if (!currentProjectId) {
          renderLobby();
        } else {
          if (!currentUserName) {
            renderOnboarding();
          } else {
            await loadWorkspace();
            initRealtimeSubscription();
          }
        }
      } catch (err) {
        console.error("Boot Error:", err);
        renderLobby();
      }
    });

    // ==========================================
    // 1. 로비 화면 (신규 프로젝트 개설)
    // ==========================================
    function renderLobby() {
      const headerTitle = document.getElementById('headerProjectTitle');
      const headerActions = document.getElementById('headerActions');
      if (headerTitle) headerTitle.classList.add('hidden');
      if (headerActions) headerActions.classList.add('hidden');
      
      const app = document.getElementById('appContainer');
      app.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center max-w-xl mx-auto w-full py-12 text-center">
          <div class="w-16 h-16 rounded-3xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mb-6 shadow-xl shadow-indigo-500/5">
            <i class="fa-solid fa-shapes text-2xl"></i>
          </div>
          <h1 class="text-3xl font-bold tracking-tight text-white mb-3">새 팀플 워크스페이스 시작하기</h1>
          <p class="text-slate-400 text-sm mb-8 leading-relaxed">
            대학 과제, 캡스톤 디자인, 해커톤까지.<br>
            복잡한 설정 없이 팀플 링크 하나로 모든 업무와 결과물을 깔끔하게 정리하세요.
          </p>
          <div class="glass-panel w-full rounded-2xl p-6 text-left shadow-2xl">
            <form onsubmit="handleCreateProject(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">프로젝트(팀플) 이름 *</label>
                <input type="text" id="newProjectTitle" required placeholder="예: 경영정보시스템 3조 기말 프로젝트" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">개설자 이름 (본인 닉네임) *</label>
                <input type="text" id="newProjectLeader" required placeholder="예: 최유겸 (팀장)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
              </div>
              <button type="submit" id="createProjectBtn" class="w-full py-3 rounded-xl text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
                <span>워크스페이스 개설하기</span> <i class="fa-solid fa-arrow-right text-xs"></i>
              </button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleCreateProject(e) {
      e.preventDefault();
      const btn = document.getElementById('createProjectBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 개설 중...`;

      const title = document.getElementById('newProjectTitle').value.trim();
      const leaderName = document.getElementById('newProjectLeader').value.trim();
      const projectCode = 'tf-' + Math.random().toString(36).substring(2, 8);
      const userId = 'usr-' + Math.random().toString(36).substring(2, 9);

      try {
        if (!sbClient) throw new Error('Supabase 클라이언트가 초기화되지 않았습니다.');
        const { error: projErr } = await sbClient.from('projects').insert([{
          id: projectCode,
          title: title,
          leader_name: leaderName,
          created_at: new Date().toISOString()
        }]);
        if (projErr) throw projErr;

        await sbClient.from('members').insert([{
          project_id: projectCode,
          user_id: userId,
          name: leaderName,
          role: '팀장'
        }]);

        localStorage.setItem('teamflow_user_id', userId);
        localStorage.setItem('teamflow_user_name', leaderName);

        window.location.search = `?p=${projectCode}`;
      } catch (err) {
        showToast('워크스페이스 생성 실패: ' + err.message, 'error');
        btn.disabled = false;
        btn.innerHTML = `<span>워크스페이스 개설하기</span> <i class="fa-solid fa-arrow-right text-xs"></i>`;
      }
    }

    // ==========================================
    // 2. 초대 링크 온보딩 (팀원 입장)
    // ==========================================
    function renderOnboarding() {
      const app = document.getElementById('appContainer');
      app.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center max-w-md mx-auto w-full py-12 text-center">
          <div class="w-14 h-14 rounded-2xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 mb-5">
            <i class="fa-solid fa-user-check text-xl"></i>
          </div>
          <h2 class="text-2xl font-bold text-white mb-2">팀플 워크스페이스 입장</h2>
          <p class="text-slate-400 text-xs mb-6">팀원들과 공유할 본인의 이름이나 역할을 입력해 주세요.</p>
          <div class="glass-panel w-full rounded-2xl p-6 text-left shadow-2xl">
            <form onsubmit="handleOnboardUser(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1.5">이름 또는 닉네임 *</label>
                <input type="text" id="onboardNameInput" required placeholder="예: 김민수 (자료조사)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 transition">
              </div>
              <button type="submit" class="w-full py-2.5 rounded-xl text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-500 transition shadow-lg shadow-indigo-600/30">
                워크스페이스 입장
              </button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleOnboardUser(e) {
      e.preventDefault();
      const name = document.getElementById('onboardNameInput').value.trim();
      const userId = 'usr-' + Math.random().toString(36).substring(2, 9);

      try {
        if (!sbClient) throw new Error('Supabase 클라이언트가 초기화되지 않았습니다.');
        await sbClient.from('members').insert([{
          project_id: currentProjectId,
          user_id: userId,
          name: name,
          role: '팀원'
        }]);

        localStorage.setItem('teamflow_user_id', userId);
        localStorage.setItem('teamflow_user_name', name);
        currentUserId = userId;
        currentUserName = name;

        await loadWorkspace();
        initRealtimeSubscription();
      } catch (err) {
        showToast('입장 실패: ' + err.message, 'error');
      }
    }

    // ==========================================
    // 3. 메인 워크스페이스 로드 & 렌더링
    // ==========================================
    async function loadWorkspace() {
      try {
        if (!sbClient) throw new Error('Supabase 클라이언트가 초기화되지 않았습니다.');
        const { data: proj, error: pErr } = await sbClient.from('projects').select('*').eq('id', currentProjectId).single();
        if (pErr || !proj) throw new Error('프로젝트를 찾을 수 없습니다.');
        currentProject = proj;

        const { data: mems } = await sbClient.from('members').select('*').eq('project_id', currentProjectId);
        currentMembers = mems || [];

        const { data: ts } = await sbClient.from('tasks').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true });
        currentTasks = ts || [];

        // 헤더 갱신
        const titleEl = document.getElementById('headerProjectTitle');
        titleEl.textContent = currentProject.title;
        titleEl.classList.remove('hidden');

        document.getElementById('headerActions').classList.remove('hidden');
        document.getElementById('currentUserName').textContent = currentUserName;

        renderWorkspaceView();
      } catch (err) {
        showToast(err.message, 'error');
      }
    }

    function renderWorkspaceView() {
      const app = document.getElementById('appContainer');

      const total = currentTasks.length;
      const completed = currentTasks.filter(t => t.status === 'done').length;
      const progress = total === 0 ? 0 : Math.round((completed / total) * 100);

      app.innerHTML = `
        <div class="glass-panel rounded-2xl p-6 mb-8 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-6">
          <div class="space-y-1">
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 rounded-md bg-indigo-500/10 text-indigo-400 text-[11px] font-medium border border-indigo-500/20">Active</span>
              <h2 class="text-xl font-bold text-white tracking-tight">${escapeHTML(currentProject.title)}</h2>
            </div>
            <p class="text-xs text-slate-400">참여 팀원: ${currentMembers.map(m => escapeHTML(m.name)).join(', ') || '없음'}</p>
          </div>

          <div class="flex items-center gap-6">
            <div class="text-right">
              <div class="text-xs text-slate-400 mb-1">전체 진행률</div>
              <div class="text-2xl font-bold text-white tracking-tight flex items-center gap-2">
                <span>${progress}%</span>
                <span class="text-xs font-normal text-slate-500">(${completed}/${total})</span>
              </div>
            </div>
            <div class="w-32 bg-slate-900 h-2.5 rounded-full overflow-hidden border border-slate-800">
              <div class="bg-gradient-to-r from-indigo-500 to-emerald-400 h-full transition-all duration-500 rounded-full" style="width: ${progress}%"></div>
            </div>
            <button onclick="openCreateTaskModal()" class="px-4 py-2.5 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg shadow-indigo-600/30 flex items-center gap-1.5 whitespace-nowrap">
              <i class="fa-solid fa-plus text-xs"></i> 새 업무
            </button>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 flex-1 items-start">
          ${renderKanbanColumn('todo', '대기', 'fa-regular fa-circle', currentTasks.filter(t => t.status === 'todo'))}
          ${renderKanbanColumn('in_progress', '진행 중', 'fa-solid fa-spinner text-blue-400', currentTasks.filter(t => t.status === 'in_progress'))}
          ${renderKanbanColumn('review', '검토 요청', 'fa-solid fa-circle-exclamation text-amber-400', currentTasks.filter(t => t.status === 'review'))}
          ${renderKanbanColumn('done', '완료됨', 'fa-solid fa-circle-check text-emerald-400', currentTasks.filter(t => t.status === 'done'))}
        </div>
      `;
    }

    function renderKanbanColumn(statusKey, title, iconClass, tasks) {
      return `
        <div class="glass-panel rounded-2xl p-4 flex flex-col min-h-[300px]">
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800/80">
            <div class="flex items-center gap-2">
              <i class="${iconClass} text-xs"></i>
              <span class="text-xs font-semibold text-slate-300">${title}</span>
            </div>
            <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-800/80 text-slate-400 font-mono">${tasks.length}</span>
          </div>

          <div class="space-y-3 flex-1">
            ${tasks.length === 0 ? `
              <div class="h-24 flex items-center justify-center text-[11px] text-slate-600 border border-dashed border-slate-800/60 rounded-xl">
                업무 없음
              </div>
            ` : tasks.map(task => `
              <div onclick="openTaskDetailModal('${task.id}')" class="glass-card rounded-xl p-3.5 cursor-pointer space-y-2.5">
                <div class="flex items-start justify-between gap-2">
                  <h4 class="text-xs font-medium text-slate-200 leading-snug">${escapeHTML(task.title)}</h4>
                </div>
                
                <div class="flex items-center justify-between text-[11px] pt-1 border-t border-slate-800/60">
                  <span class="text-slate-400 flex items-center gap-1">
                    <i class="fa-regular fa-user text-[10px]"></i>
                    ${escapeHTML(task.assignee_name || '미정')}
                  </span>
                  ${task.due_date ? `
                    <span class="text-slate-500 font-mono text-[10px]"><i class="fa-regular fa-calendar mr-1"></i>${task.due_date}</span>
                  ` : ''}
                </div>

                ${(task.files?.length > 0 || task.links?.length > 0) ? `
                  <div class="flex items-center gap-2 text-[10px] text-indigo-400 pt-0.5">
                    ${task.files?.length > 0 ? `<span><i class="fa-solid fa-paperclip"></i> ${task.files.length}</span>` : ''}
                    ${task.links?.length > 0 ? `<span><i class="fa-solid fa-link"></i> ${task.links.length}</span>` : ''}
                  </div>
                ` : ''}
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // ==========================================
    // 4. 실시간 동기화 (Supabase Realtime)
    // ==========================================
    function initRealtimeSubscription() {
      if (!sbClient || !currentProjectId) return;

      sbClient
        .channel(`project-sync-${currentProjectId}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks', filter: `project_id=eq.${currentProjectId}` }, async () => {
          await refreshTasksOnly();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'members', filter: `project_id=eq.${currentProjectId}` }, async () => {
          const { data: mems } = await sbClient.from('members').select('*').eq('project_id', currentProjectId);
          currentMembers = mems || [];
          renderWorkspaceView();
        })
        .subscribe();
    }

    async function refreshTasksOnly() {
      if (!sbClient) return;
      const { data: ts } = await sbClient.from('tasks').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true });
      currentTasks = ts || [];
      renderWorkspaceView();

      if (activeTask) {
        const updated = currentTasks.find(t => t.id === activeTask.id);
        if (updated) {
          activeTask = updated;
          renderTaskDetailModalContent();
        }
      }
    }

    // ==========================================
    // 5. 모달 및 업무 조작 핸들러
    // ==========================================
    function openCreateTaskModal() {
      const select = document.getElementById('taskAssigneeSelect');
      select.innerHTML = '<option value="">미정 (나중에 지정)</option>' + 
        currentMembers.map(m => `<option value="${escapeHTML(m.name)}">${escapeHTML(m.name)}</option>`).join('');
      
      document.getElementById('taskTitleInput').value = '';
      document.getElementById('taskDescInput').value = '';
      document.getElementById('taskDueDateInput').value = '';
      document.getElementById('createTaskModal').classList.remove('hidden');
    }

    async function handleCreateTask(e) {
      e.preventDefault();
      const title = document.getElementById('taskTitleInput').value.trim();
      const desc = document.getElementById('taskDescInput').value.trim();
      const assignee = document.getElementById('taskAssigneeSelect').value;
      const dueDate = document.getElementById('taskDueDateInput').value || null;

      const btn = document.getElementById('createTaskSubmitBtn');
      btn.disabled = true;

      try {
        if (!sbClient) throw new Error('Supabase 클라이언트가 초기화되지 않았습니다.');
        const { error } = await sbClient.from('tasks').insert([{
          project_id: currentProjectId,
          title: title,
          description: desc,
          assignee_name: assignee || null,
          due_date: dueDate,
          status: 'todo',
          files: [],
          links: [],
          created_at: new Date().toISOString()
        }]);

        if (error) throw error;
        closeModal('createTaskModal');
        showToast('새 업무가 등록되었습니다.', 'success');
      } catch (err) {
        showToast('업무 등록 오류: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function openTaskDetailModal(taskId) {
      activeTask = currentTasks.find(t => t.id === taskId);
      if (!activeTask) return;

      renderTaskDetailModalContent();
      document.getElementById('taskDetailModal').classList.remove('hidden');
    }

    function renderTaskDetailModalContent() {
      document.getElementById('modalTaskTitle').textContent = activeTask.title;
      document.getElementById('modalTaskDesc').textContent = activeTask.description || '(상세 설명이 없습니다)';
      document.getElementById('modalTaskDueDate').textContent = activeTask.due_date || '미설정';

      const statusMap = { todo: '대기', in_progress: '진행 중', review: '검토 요청', done: '완료됨' };
      const statusBadge = document.getElementById('modalTaskStatusBadge');
      statusBadge.textContent = statusMap[activeTask.status] || '대기';
      statusBadge.className = `text-xs px-2.5 py-1 rounded-full font-medium badge-${activeTask.status}`;

      document.getElementById('modalStatusSelect').value = activeTask.status;

      const assigneeSelect = document.getElementById('modalAssigneeSelect');
      assigneeSelect.innerHTML = '<option value="">미정</option>' + 
        currentMembers.map(m => `<option value="${escapeHTML(m.name)}" ${m.name === activeTask.assignee_name ? 'selected' : ''}>${escapeHTML(m.name)}</option>`).join('');

      const isAuthorized = !activeTask.assignee_name || activeTask.assignee_name === currentUserName;
      const uploadSec = document.getElementById('uploadSection');
      const authNotice = document.getElementById('assigneeOnlyNotice');

      if (isAuthorized) {
        uploadSec.classList.remove('opacity-40', 'pointer-events-none');
        authNotice.classList.add('hidden');
      } else {
        uploadSec.classList.add('opacity-40', 'pointer-events-none');
        authNotice.classList.remove('hidden');
      }

      const filesContainer = document.getElementById('modalFilesList');
      const files = activeTask.files || [];
      filesContainer.innerHTML = files.length === 0 ? '<div class="text-xs text-slate-500 py-1">첨부된 파일이 없습니다.</div>' : files.map((f, i) => `
        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-900/80 border border-slate-800 text-xs">
          <a href="${f.url}" target="_blank" class="text-indigo-400 hover:underline flex items-center gap-1.5 truncate max-w-[80%]">
            <i class="fa-regular fa-file"></i> <span class="truncate">${escapeHTML(f.name)}</span>
          </a>
          ${isAuthorized ? `<button onclick="handleDeleteFile(${i})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>` : ''}
        </div>
      `).join('');

      const linksContainer = document.getElementById('modalLinksList');
      const links = activeTask.links || [];
      linksContainer.innerHTML = links.length === 0 ? '<div class="text-xs text-slate-500 py-1">첨부된 링크가 없습니다.</div>' : links.map((l, i) => `
        <div class="flex items-center justify-between p-2 rounded-lg bg-slate-900/80 border border-slate-800 text-xs">
          <a href="${l.url}" target="_blank" class="text-cyan-400 hover:underline flex items-center gap-1.5 truncate max-w-[80%]">
            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> <span class="truncate">${escapeHTML(l.title || l.url)}</span>
          </a>
          ${isAuthorized ? `<button onclick="handleDeleteLink(${i})" class="text-slate-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>` : ''}
        </div>
      `).join('');
    }

    async function handleAssigneeChange(e) {
      const newAssignee = e.target.value || null;
      try {
        if (!sbClient) return;
        await sbClient.from('tasks').update({ assignee_name: newAssignee }).eq('id', activeTask.id);
        activeTask.assignee_name = newAssignee;
        showToast('담당자가 변경되었습니다.', 'success');
      } catch (err) {
        showToast('담당자 변경 실패: ' + err.message, 'error');
      }
    }

    async function handleStatusChange(e) {
      const newStatus = e.target.value;
      try {
        if (!sbClient) return;
        await sbClient.from('tasks').update({ status: newStatus }).eq('id', activeTask.id);
        activeTask.status = newStatus;
        showToast('상태가 업데이트되었습니다.', 'success');
      } catch (err) {
        showToast('상태 변경 실패: ' + err.message, 'error');
      }
    }

    async function handleBatchFileUpload() {
      const input = document.getElementById('fileInputBatch');
      const files = Array.from(input.files);
      if (files.length === 0) return showToast('업로드할 파일을 선택하세요.', 'error');

      const btn = document.getElementById('fileUploadBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 업로드 중...`;

      try {
        if (!sbClient) throw new Error('Supabase 클라이언트가 초기화되지 않았습니다.');
        const uploadedList = [...(activeTask.files || [])];

        for (const file of files) {
          const filePath = `${currentProjectId}/${activeTask.id}/${Date.now()}_${file.name}`;
          const { error: upErr } = await sbClient.storage.from('attachments').upload(filePath, file);

          if (upErr) throw new Error(`스토리지 권한 오류: ${upErr.message}`);

          const { data: pubData } = sbClient.storage.from('attachments').getPublicUrl(filePath);
          uploadedList.push({ name: file.name, url: pubData.publicUrl });
        }

        await sbClient.from('tasks').update({ files: uploadedList }).eq('id', activeTask.id);
        input.value = '';
        showToast('파일 업로드가 완료되었습니다.', 'success');
      } catch (err) {
        showToast(err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> 파일 일괄 업로드`;
      }
    }

    async function handleAddLink() {
      const titleInput = document.getElementById('linkTitleInput');
      const urlInput = document.getElementById('linkUrlInput');
      const url = urlInput.value.trim();
      const title = titleInput.value.trim() || url;

      if (!url) return showToast('링크 URL을 입력해 주세요.', 'error');

      try {
        if (!sbClient) return;
        const links = [...(activeTask.links || []), { title, url }];
        await sbClient.from('tasks').update({ links }).eq('id', activeTask.id);
        titleInput.value = '';
        urlInput.value = '';
        showToast('링크가 추가되었습니다.', 'success');
      } catch (err) {
        showToast('링크 추가 실패: ' + err.message, 'error');
      }
    }

    async function handleDeleteFile(index) {
      if (!sbClient) return;
      const files = [...activeTask.files];
      files.splice(index, 1);
      await sbClient.from('tasks').update({ files }).eq('id', activeTask.id);
    }

    async function handleDeleteLink(index) {
      if (!sbClient) return;
      const links = [...activeTask.links];
      links.splice(index, 1);
      await sbClient.from('tasks').update({ links }).eq('id', activeTask.id);
    }

    async function handleDeleteTask() {
      if (!confirm('이 업무를 완전히 삭제하시겠습니까?')) return;
      try {
        if (!sbClient) return;
        await sbClient.from('tasks').delete().eq('id', activeTask.id);
        closeModal('taskDetailModal');
        showToast('업무가 삭제되었습니다.', 'success');
      } catch (err) {
        showToast('업무 삭제 실패: ' + err.message, 'error');
      }
    }

    // ==========================================
    // 6. 초대 링크 모달 및 유틸리티
    // ==========================================
    function openInviteModal() {
      const url = window.location.origin + window.location.pathname + `?p=${currentProjectId}`;
      document.getElementById('inviteUrlField').value = url;
      document.getElementById('inviteCodeField').textContent = currentProjectId;
      document.getElementById('inviteModal').classList.remove('hidden');
    }

    function copyInviteUrl() {
      const input = document.getElementById('inviteUrlField');
      input.select();
      navigator.clipboard.writeText(input.value).then(() => {
        showToast('초대 링크가 클립보드에 복사되었습니다.', 'success');
      }).catch(() => {
        document.execCommand('copy');
        showToast('초대 링크 복사 완료', 'success');
      });
    }

    function closeModal(id) {
      document.getElementById(id).classList.add('hidden');
    }

    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl text-xs font-medium flex items-center gap-2 transition-all duration-300 transform translate-y-0 opacity-100 ${
        type === 'error' ? 'bg-rose-500 text-white' : 'bg-slate-800 text-indigo-300 border border-slate-700'
      }`;
      setTimeout(() => {
        toast.className = toast.className.replace('opacity-100', 'opacity-0 translate-y-2 pointer-events-none');
      }, 2500);
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[tag] || tag));
    }
  </script>
</body>
</html>
