<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamFlow — All-in-One Project Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-canvas: #07080c;
      --bg-surface: rgba(17, 19, 26, 0.85);
      --bg-card: rgba(24, 27, 36, 0.92);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(99, 102, 241, 0.5);
    }
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; box-sizing: border-box; }
    body { background-color: var(--bg-canvas); color: #f1f5f9; overflow: hidden; height: 100vh; font-size: 14px; letter-spacing: -0.01em; }

    /* Modern Glass & Surface */
    .surface-panel {
      background: var(--bg-surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }
    .surface-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.45), inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      transition: transform 0.16s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .surface-card:hover {
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 16px 36px -6px rgba(0, 0, 0, 0.65), inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
    }

    /* Infinite-feel Dot Matrix Canvas with Ambient Glow */
    .canvas-grid {
      background-color: #07080c;
      background-image: 
        radial-gradient(circle at 50% 35%, rgba(79, 70, 229, 0.08) 0%, transparent 55%),
        radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
      background-size: 100% 100%, 28px 28px;
    }

    /* Hide ugly scrollbars on canvas, sleek scrollbars elsewhere */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

    /* Refined Priority & Status Chips */
    .pri-urgent { background: rgba(244, 63, 94, 0.14); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.3); }
    .pri-high { background: rgba(249, 115, 22, 0.14); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.3); }
    .pri-medium { background: rgba(99, 102, 241, 0.14); color: #a5b4fc; border: 1px solid rgba(99, 102, 241, 0.3); }
    .pri-low { background: rgba(148, 163, 184, 0.12); color: #cbd5e1; border: 1px solid rgba(148, 163, 184, 0.25); }

    /* Node Canvas Elements */
    .map-node {
      position: absolute;
      width: 284px;
      user-select: none;
      cursor: grab;
      z-index: 10;
    }
    .map-node:active { cursor: grabbing; z-index: 30; transform: scale(1.015); }
    .map-node.connect-source {
      border-color: #818cf8 !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.35), 0 20px 40px rgba(0,0,0,0.6) !important;
    }

    /* Node Connection Ports (Handles) */
    .node-port {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background: #1e1b4b;
      border: 2px solid #818cf8;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease, background-color 0.15s ease;
      z-index: 20;
      cursor: crosshair;
    }
    .map-node:hover .node-port, .map-node.connect-source .node-port { opacity: 1; }
    .node-port:hover { transform: scale(1.4); background: #6366f1; }
    .port-top { top: -5px; left: calc(50% - 5px); }
    .port-bottom { bottom: -5px; left: calc(50% - 5px); }
    .port-left { left: -5px; top: calc(50% - 5px); }
    .port-right { right: -5px; top: calc(50% - 5px); }

    /* Animated Pipeline Edges */
    @keyframes flowDash {
      to { stroke-dashoffset: -24; }
    }
    .edge-group { pointer-events: stroke; cursor: pointer; }
    .edge-bg { fill: none; stroke: transparent; stroke-width: 16; }
    .edge-line { fill: none; stroke-width: 2.2; transition: stroke 0.2s, stroke-width 0.2s, filter 0.2s; }
    .edge-animated { stroke-dasharray: 7 5; animation: flowDash 0.9s linear infinite; }
    .edge-group:hover .edge-line { stroke: #f43f5e !important; stroke-width: 3.5; filter: drop-shadow(0 0 6px rgba(244,63,94,0.6)); }

    .dropzone-active { border-color: #818cf8 !important; background-color: rgba(99, 102, 241, 0.12) !important; }
  </style>
</head>
<body class="flex flex-col select-none">

  <!-- Top Navigation Header -->
  <header class="h-14 border-b border-white/[0.07] bg-[#0b0d13]/90 backdrop-blur-xl px-5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3.5">
      <div onclick="goToWorkspaceHub()" class="flex items-center gap-2.5 cursor-pointer group" title="워크스페이스 허브로 이동">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white text-sm font-bold shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <span class="font-bold text-base tracking-tight text-white group-hover:text-indigo-400 transition">TeamFlow</span>
      </div>

      <span id="headerDivider" class="text-slate-700 text-sm hidden">/</span>

      <!-- Project Selector & View Switcher -->
      <div id="headerProjectArea" class="items-center gap-4 hidden">
        <button onclick="goToWorkspaceHub()" class="flex items-center gap-2 text-sm font-semibold text-slate-200 px-3 py-1.5 rounded-xl bg-white/[0.04] hover:bg-white/[0.08] border border-white/[0.07] transition">
          <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
          <span id="headerProjectTitle">프로젝트</span>
          <i class="fa-solid fa-chevron-down text-[10px] text-slate-500 ml-0.5"></i>
        </button>

        <nav class="flex items-center bg-black/40 p-1 rounded-xl border border-white/[0.07]">
          <button onclick="switchView('map')" id="tabBtn-map" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-diagram-project text-xs"></i> 워크플로우 맵
          </button>
          <button onclick="switchView('kanban')" id="tabBtn-kanban" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-table-columns text-xs"></i> 칸반 보드
          </button>
          <button onclick="switchView('docs')" id="tabBtn-docs" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-regular fa-file-lines text-xs"></i> 팀 문서 & 공지
          </button>
        </nav>
      </div>
    </div>

    <!-- Right Controls -->
    <div id="headerActions" class="items-center gap-2.5 hidden">
      <div class="hidden lg:flex items-center gap-2.5 px-3 py-1.5 rounded-xl bg-white/[0.03] border border-white/[0.07] text-xs">
        <span class="text-slate-400">달성률</span>
        <span id="headerProgressText" class="font-mono font-bold text-emerald-400 text-sm">0%</span>
        <div class="w-16 h-1.5 bg-slate-800 rounded-full overflow-hidden">
          <div id="headerProgressBar" class="h-full bg-gradient-to-r from-indigo-500 to-emerald-400 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <button onclick="openCreateTaskModal()" class="px-3.5 py-1.5 rounded-xl text-sm font-semibold bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white transition flex items-center gap-1.5 shadow-lg shadow-indigo-600/25">
        <i class="fa-solid fa-plus text-xs"></i> 새 업무
      </button>

      <button onclick="openInviteModal()" class="px-3 py-1.5 rounded-xl text-sm font-medium bg-white/[0.04] hover:bg-white/[0.08] text-slate-200 border border-white/[0.08] transition flex items-center gap-1.5">
        <i class="fa-solid fa-user-plus text-xs text-indigo-400"></i> 초대
      </button>

      <button onclick="toggleChatDrawer()" id="chatToggleBtn" class="px-3 py-1.5 rounded-xl text-sm font-medium bg-white/[0.04] hover:bg-white/[0.08] text-slate-200 border border-white/[0.08] transition flex items-center gap-1.5 relative">
        <i class="fa-regular fa-comment-dots text-indigo-400"></i> 채널 채팅
        <span id="chatUnreadDot" class="w-2 h-2 rounded-full bg-rose-500 absolute top-1.5 right-1.5 hidden"></span>
      </button>

      <div class="h-4 w-[1px] bg-white/[0.08] mx-0.5"></div>

      <div class="flex items-center gap-2 pl-2 pr-3 py-1 rounded-xl bg-white/[0.04] border border-white/[0.07] text-sm text-slate-200">
        <div id="headerUserAvatar" class="w-6 h-6 rounded-lg bg-indigo-500/20 border border-indigo-400/30 text-indigo-300 text-xs font-bold flex items-center justify-center">U</div>
        <span id="currentUserName" class="font-medium text-xs">멤버</span>
      </div>
    </div>
  </header>

  <!-- Main Workspace Area + Chat Drawer -->
  <div class="flex-1 flex overflow-hidden relative">
    <main id="appContainer" class="flex-1 flex flex-col overflow-hidden relative"></main>

    <!-- Right Collapsible Chat Drawer -->
    <aside id="chatDrawer" class="w-[440px] border-l border-white/[0.08] bg-[#0b0d13]/95 backdrop-blur-2xl flex-row shrink-0 hidden z-30 shadow-2xl">
      <div class="w-40 border-r border-white/[0.06] bg-black/30 flex flex-col shrink-0">
        <div class="p-3.5 border-b border-white/[0.06] flex items-center justify-between">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">토픽 채널</span>
          <button onclick="handleCreateChannel()" class="w-5 h-5 rounded hover:bg-white/10 text-slate-400 hover:text-white text-xs flex items-center justify-center" title="새 채널 추가">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
        <div id="chatChannelsList" class="p-2 space-y-1 overflow-y-auto max-h-52"></div>

        <div class="p-3.5 border-t border-b border-white/[0.06] flex items-center justify-between mt-2">
          <span class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">1:1 DM</span>
        </div>
        <div id="chatDmMembersList" class="p-2 space-y-1 flex-1 overflow-y-auto"></div>
      </div>

      <div class="flex-1 flex flex-col overflow-hidden">
        <div class="h-12 px-4 border-b border-white/[0.06] flex items-center justify-between shrink-0">
          <span id="activeChatRoomTitle" class="text-sm font-bold text-white truncate"># 일반</span>
          <button onclick="toggleChatDrawer()" class="w-7 h-7 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white text-sm flex items-center justify-center">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div id="chatMessagesList" class="flex-1 overflow-y-auto p-4 space-y-3 select-text"></div>

        <div id="chatTaskRefBanner" class="px-3.5 py-2 bg-indigo-950/60 border-t border-indigo-500/30 hidden items-center justify-between text-xs text-indigo-300">
          <span id="chatTaskRefText" class="truncate"></span>
          <button onclick="clearChatTaskRef()" class="text-indigo-400 hover:text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form onsubmit="handleSendMessage(event)" class="p-3 border-t border-white/[0.06] bg-black/30 flex gap-2">
          <input type="text" id="chatInput" placeholder="메시지 입력..." class="flex-1 bg-white/[0.05] border border-white/[0.08] rounded-xl px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition">
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </form>
      </div>
    </aside>
  </div>

  <!-- ==========================================
       MODALS
  =========================================== -->

  <!-- 1. Create Task Modal -->
  <div id="createTaskModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="surface-panel w-full max-w-xl rounded-2xl overflow-hidden max-h-[92vh] flex flex-col">
      <div class="px-6 py-4 border-b border-white/[0.08] flex items-center justify-between">
        <h3 class="text-base font-bold text-white flex items-center gap-2.5">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> 새 업무 생성
        </h3>
        <button onclick="closeModal('createTaskModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form onsubmit="handleCreateTask(event)" class="p-6 space-y-4 overflow-y-auto flex-1">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">업무 제목 *</label>
          <input type="text" id="taskTitleInput" required placeholder="예: 결제 API 연동 / 경쟁사 리서치 정리" class="w-full bg-black/40 border border-white/[0.1] rounded-xl px-3.5 py-2.5 text-sm font-medium text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1.5">상세 설명 & 메모</label>
          <textarea id="taskDescInput" rows="3" placeholder="업무 요구사항, 배경 맥락, 참고 메모를 적어주세요..." class="w-full bg-black/40 border border-white/[0.1] rounded-xl px-3.5 py-2.5 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">담당자</label>
            <select id="taskAssigneeSelect" class="w-full bg-black/40 border border-white/[0.1] rounded-xl px-2.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="">미정</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">우선순위</label>
            <select id="taskPrioritySelect" class="w-full bg-black/40 border border-white/[0.1] rounded-xl px-2.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="medium">보통</option>
              <option value="urgent">긴급</option>
              <option value="high">높음</option>
              <option value="low">낮음</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">라벨 (태그)</label>
            <input type="text" id="taskLabelInput" placeholder="기획, 개발, 디자인..." value="일반" class="w-full bg-black/40 border border-white/[0.1] rounded-xl px-2.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">마감 기한</label>
            <input type="date" id="taskDueDateInput" class="w-full bg-black/40 border border-white/[0.1] rounded-xl px-2.5 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div class="p-4 rounded-xl bg-black/30 border border-white/[0.07] space-y-3">
          <div class="text-xs font-semibold text-slate-300 flex items-center justify-between">
            <span><i class="fa-solid fa-paperclip text-indigo-400 mr-1.5"></i>초기 첨부 파일 & 참고 링크</span>
            <span class="text-[11px] text-slate-500">여러 폴더의 파일을 하나씩 대기열에 추가 가능</span>
          </div>

          <div class="flex items-center gap-2">
            <label class="px-3 py-1.5 rounded-lg bg-white/[0.06] hover:bg-white/[0.1] text-slate-200 text-xs font-medium cursor-pointer border border-white/[0.08] transition">
              <i class="fa-solid fa-folder-open mr-1.5 text-indigo-400"></i>+ 파일 선택하여 대기열 추가
              <input type="file" multiple onchange="handleStageCreationFiles(event)" class="hidden">
            </label>
          </div>
          <div id="createStagedFilesList" class="space-y-1.5"></div>

          <div class="flex gap-2 pt-1">
            <input type="text" id="createLinkTitleInput" placeholder="링크 제목 (예: 피그마)" class="w-1/3 bg-black/40 border border-white/[0.08] rounded-lg px-3 py-1.5 text-xs text-white">
            <input type="url" id="createLinkUrlInput" placeholder="https://..." class="flex-1 bg-black/40 border border-white/[0.08] rounded-lg px-3 py-1.5 text-xs text-white">
            <button type="button" onclick="handleStageCreationLink()" class="px-3 py-1.5 rounded-lg bg-white/[0.06] hover:bg-white/[0.1] text-xs font-medium text-slate-200 border border-white/[0.08] whitespace-nowrap">
              + 링크 추가
            </button>
          </div>
          <div id="createStagedLinksList" class="space-y-1.5"></div>
        </div>

        <div class="pt-3 flex items-center justify-between border-t border-white/[0.08]">
          <label class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">
            <input type="checkbox" id="taskPutInMapCheck" class="w-4 h-4 rounded bg-black/40 border-slate-700 text-indigo-600 focus:ring-0">
            <span>생성 즉시 워크플로우 맵에 배치</span>
          </label>
          <div class="flex gap-2">
            <button type="button" onclick="closeModal('createTaskModal')" class="px-4 py-2 rounded-xl text-sm text-slate-400 hover:text-white">취소</button>
            <button type="submit" id="createTaskSubmitBtn" class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/25">업무 등록</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Task Detail Modal -->
  <div id="taskDetailModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="surface-panel w-full max-w-3xl rounded-2xl max-h-[90vh] flex flex-col overflow-hidden select-text">
      <div class="px-6 py-4 border-b border-white/[0.08] flex items-center justify-between bg-black/30">
        <div class="flex items-center gap-2.5">
          <span id="modalTaskLabelBadge" class="px-2.5 py-1 rounded-lg text-xs font-semibold bg-white/[0.06] text-slate-200 border border-white/[0.08]">일반</span>
          <span id="modalTaskPriorityBadge" class="px-2.5 py-1 rounded-lg text-xs font-semibold">보통</span>
          <button onclick="shareActiveTaskToChat()" class="px-2.5 py-1 rounded-lg text-xs font-medium bg-indigo-500/15 text-indigo-300 hover:bg-indigo-500/25 border border-indigo-500/30 transition flex items-center gap-1.5">
            <i class="fa-regular fa-paper-plane text-[11px]"></i> 채팅에 공유
          </button>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="handleDeleteTask()" class="text-sm text-slate-400 hover:text-rose-400 px-2.5 py-1 transition">
            <i class="fa-regular fa-trash-can"></i> 삭제
          </button>
          <button onclick="closeModal('taskDetailModal')" class="text-slate-400 hover:text-white px-1.5"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <div>
          <h2 id="modalTaskTitle" class="text-xl font-bold text-white tracking-tight mb-2.5"></h2>
          <p id="modalTaskDesc" class="text-sm text-slate-300 leading-relaxed whitespace-pre-wrap bg-black/30 p-4 rounded-xl border border-white/[0.07]"></p>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 p-3.5 rounded-xl bg-black/30 border border-white/[0.07] text-sm">
          <div>
            <span class="text-xs text-slate-400 block mb-1">진행 상태</span>
            <select id="modalStatusSelect" onchange="handleTaskFieldUpdate('status', this.value)" class="w-full bg-[#141720] border border-white/[0.1] rounded-lg px-2.5 py-1.5 text-sm text-white">
              <option value="todo">대기 (Todo)</option>
              <option value="in_progress">진행 중 (In Progress)</option>
              <option value="review">검토 요청 (Review)</option>
              <option value="done">완료됨 (Done)</option>
            </select>
          </div>
          <div>
            <span class="text-xs text-slate-400 block mb-1">담당자</span>
            <select id="modalAssigneeSelect" onchange="handleTaskFieldUpdate('assignee_name', this.value || null)" class="w-full bg-[#141720] border border-white/[0.1] rounded-lg px-2.5 py-1.5 text-sm text-white">
              <option value="">미정</option>
            </select>
          </div>
          <div>
            <span class="text-xs text-slate-400 block mb-1">우선순위</span>
            <select id="modalPrioritySelect" onchange="handleTaskFieldUpdate('priority', this.value)" class="w-full bg-[#141720] border border-white/[0.1] rounded-lg px-2.5 py-1.5 text-sm text-white">
              <option value="urgent">긴급</option>
              <option value="high">높음</option>
              <option value="medium">보통</option>
              <option value="low">낮음</option>

    function saveWorkspaceToLocal(proj) {
      if (!proj || !proj.id) return;
      const list = getSavedWorkspaces().filter(w => w.id !== proj.id);
      list.unshift({ id: proj.id, title: proj.title, accessed_at: new Date().toLocaleDateString() });
      localStorage.setItem('teamflow_workspaces', JSON.stringify(list.slice(0, 20)));
    }
    function removeWorkspaceFromLocal(id) {
      const list = getSavedWorkspaces().filter(w => w.id !== id);
      localStorage.setItem('teamflow_workspaces', JSON.stringify(list));
      renderWorkspaceHub();

    document.addEventListener('DOMContentLoaded', async () => {

      app.innerHTML = `

                        <div class="flex items-center justify-between text-xs text-slate-400 pt-3 border-t border-white/[0.06]">
                          <span>최근 접속: ${w.accessed_at || '-'}</span>
                          <span class="text-indigo-400 font-semibold group-hover:translate-x-0.5 transition">입장하기 →</span>

                      </div>
                    `).join('')}
                  </div>
                `}

                <div class="surface-panel rounded-2xl p-5 flex flex-col sm:flex-row items-center justify-between gap-3">

                  <form onsubmit="handleJoinByCode(event)" class="flex gap-2 w-full sm:w-auto">
                    <input type="text" id="joinCodeInput" required placeholder="tf-xxxxxx" class="bg-black/40 border border-white/[0.1] rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 w-full sm:w-44 font-mono">
                    <button type="submit" class="px-4 py-2 rounded-xl bg-white/[0.08] hover:bg-white/[0.14] text-sm font-semibold text-white whitespace-nowrap">합류</button>
                  </form>
                </div>
              </div>

              <div class="surface-panel rounded-2xl p-6 space-y-4">
                <div class="flex items-center gap-2.5">
                  <div class="w-9 h-9 rounded-xl bg-indigo-500/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">

      e.preventDefault();
      let raw = document.getElementById('joinCodeInput').value.trim();
      if (raw.includes('?p=')) raw = raw.split('?p=')[1].split('&')[0];
      if (raw) window.location.search = `?p=${raw}`;
    }

    function handleChangeGlobalUserName() {
      const next = prompt('변경할 이름(닉네임)을 입력하세요:', currentUserName || '');
      if (next && next.trim()) {
        currentUserName = next.trim();
        localStorage.setItem('teamflow_user_name', currentUserName);
        renderWorkspaceHub();
      }
    }

    async function handleCreateProject(e) {
      e.preventDefault();
      const btn = document.getElementById('createProjectBtn');
      btn.disabled = true;
      btn.textContent = '생성 중...';

      const title = document.getElementById('newProjectTitle').value.trim();
      const leaderName = document.getElementById('newProjectLeader').value.trim();
      const projectCode = 'tf-' + Math.random().toString(36).substring(2, 8);

      try {
        const { error: pErr } = await sbClient.from('projects').insert([{
          id: projectCode,
          title,
          leader_name: leaderName,
          channels: ['일반', '기획-논의', '제작-개발']
        }]);
        if (pErr) throw pErr;

        await sbClient.from('members').insert([{ project_id: projectCode, user_id: currentUserId, name: leaderName, role: '리더' }]);
        await sbClient.from('docs').insert([{
          project_id: projectCode,
          title: '📌 프로젝트 핵심 목표 & 공지사항',

          updated_by: leaderName
        }]);

        currentUserName = leaderName;
        localStorage.setItem('teamflow_user_name', leaderName);

        window.location.search = `?p=${projectCode}`;

        btn.textContent = '워크스페이스 생성하기 →';
      }

          </div>
        </div>
      `;

    async function handleOnboardUser(e) {
      e.preventDefault();
      const name = document.getElementById('onboardNameInput').value.trim();
      await sbClient.from('members').insert([{ project_id: currentProjectId, user_id: currentUserId, name, role: '멤버' }]);
      localStorage.setItem('teamflow_user_name', name);
      currentUserName = name;
      await loadWorkspace();
      initRealtimeSubscription();
    }

    // ==========================================
    // 2. LOAD WORKSPACE & REALTIME
    // ==========================================
    async function loadWorkspace() {
      try {
        const { data: proj, error } = await sbClient.from('projects').select('*').eq('id', currentProjectId).single();
        if (error || !proj) throw new Error('해당 워크스페이스를 찾을 수 없습니다.');
        currentProject = proj;
        saveWorkspaceToLocal(proj);

        const [memsRes, tasksRes, msgsRes, docsRes] = await Promise.all([
          sbClient.from('members').select('*').eq('project_id', currentProjectId),
          sbClient.from('tasks').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true }),
          sbClient.from('messages').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true }),
          sbClient.from('docs').select('*').eq('project_id', currentProjectId).order('is_pinned', { ascending: false }).order('updated_at', { ascending: false })
        ]);

        currentMembers = memsRes.data || [];
        currentTasks = tasksRes.data || [];
        currentMessages = msgsRes.data || [];
        currentDocs = docsRes.data || [];

        if (currentUserName && !currentMembers.some(m => m.name === currentUserName)) {
          await sbClient.from('members').insert([{ project_id: currentProjectId, user_id: currentUserId, name: currentUserName, role: '멤버' }]);
          const { data: m2 } = await sbClient.from('members').select('*').eq('project_id', currentProjectId);
          currentMembers = m2 || [];
        }

        document.getElementById('headerDivider').classList.remove('hidden');
        document.getElementById('headerProjectArea').classList.remove('hidden');
        document.getElementById('headerProjectArea').classList.add('flex');
        document.getElementById('headerActions').classList.remove('hidden');
        document.getElementById('headerActions').classList.add('flex');

        document.getElementById('currentUserName').textContent = currentUserName;
        document.getElementById('headerUserAvatar').textContent = getInitials(currentUserName);
        updateTopBarStats();
        renderActiveViewport();

    function updateTopBarStats() {
      if (!currentProject) return;
      document.getElementById('headerProjectTitle').textContent = currentProject.title;

      const total = currentTasks.length;
      const done = currentTasks.filter(t => t.status === 'done').length;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('headerProgressText').textContent = `${pct}%`;
      document.getElementById('headerProgressBar').style.width = `${pct}%`;

      ['map', 'kanban', 'docs'].forEach(v => {
        const btn = document.getElementById(`tabBtn-${v}`);
        if (v === currentView) {
          btn.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition flex items-center gap-2 bg-indigo-600 text-white shadow-sm';
        } else {
          btn.className = 'px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2 text-slate-400 hover:text-white';
        }
      });
    }

      currentView = view;

    function initRealtimeSubscription() {
      if (!sbClient || !currentProjectId) return;
      sbClient.channel(`tf-v3-${currentProjectId}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks', filter: `project_id=eq.${currentProjectId}` }, async () => {
          const { data } = await sbClient.from('tasks').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true });
          currentTasks = data || [];
          updateTopBarStats();
          if (!draggingTaskId) renderActiveViewport();
          if (activeTask) {
            const found = currentTasks.find(t => String(t.id) === String(activeTask.id));
            if (found) { activeTask = found; renderTaskDetailModalContent(); }
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: `project_id=eq.${currentProjectId}` }, async () => {
          const { data } = await sbClient.from('messages').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true });
          currentMessages = data || [];
          renderChatDrawerUI();
          if (!isChatOpen) document.getElementById('chatUnreadDot').classList.remove('hidden');
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: `project_id=eq.${currentProjectId}` }, async () => {
          const { data } = await sbClient.from('docs').select('*').eq('project_id', currentProjectId).order('is_pinned', { ascending: false }).order('updated_at', { ascending: false });
          currentDocs = data || [];
          if (currentView === 'docs') renderDocsWikiView();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'projects', filter: `id=eq.${currentProjectId}` }, async (payload) => {
          if (payload.new) { currentProject = payload.new; updateTopBarStats(); renderChatDrawerUI(); }
        })
        .subscribe();
    }

    // ==========================================
    // 3. VIEW 1: SMART 4-SIDED ROUTING WORKFLOW MAP
    // ==========================================
    const NODE_WIDTH = 284;
    const NODE_HEIGHT = 132;
    const NODE_GAP = 24;

    function findNonOverlappingPosition(targetX, targetY, excludeTaskId) {
      let x = Math.max(40, Math.round(targetX / 14) * 14);
      let y = Math.max(80, Math.round(targetY / 14) * 14);
      const others = currentTasks.filter(t => t.in_map && String(t.id) !== String(excludeTaskId));

      let guard = 0;
      while (guard < 60) {
        const hit = others.find(o => {
          const ox = o.pos_x || 360;
          const oy = o.pos_y || 160;
          return Math.abs(x - ox) < (NODE_WIDTH + NODE_GAP) && Math.abs(y - oy) < (NODE_HEIGHT + NODE_GAP);
        });
        if (!hit) break;
        x = (hit.pos_x || 360) + NODE_WIDTH + NODE_GAP;
        if (x > 1800) {
          x = 360;
          y += NODE_HEIGHT + NODE_GAP;
        }
        guard++;
      }
      return { x, y };
    }

    // #2: 4방향 스마트 앵커 라우팅 (상하좌우 중 가장 자연스러운 면끼리 부드럽게 연결)
    function computeSmartEdgeGeometry(source, target) {
      const sx = source.pos_x || 380;
      const sy = source.pos_y || 160;
      const tx = target.pos_x || 380;
      const ty = target.pos_y || 160;

      const scx = sx + NODE_WIDTH / 2;
      const scy = sy + NODE_HEIGHT / 2;
      const tcx = tx + NODE_WIDTH / 2;
      const tcy = ty + NODE_HEIGHT / 2;

      const dx = tcx - scx;
      const dy = tcy - scy;

      let x1, y1, x2, y2, c1x, c1y, c2x, c2y;

      // 가로 거리가 세로 거리보다 넓거나 비슷할 때 -> 좌/우 포트 연결
      if (Math.abs(dx) >= Math.abs(dy) * 0.85) {
        if (dx >= 0) {
          // Source 오른쪽 -> Target 왼쪽
          x1 = sx + NODE_WIDTH; y1 = scy;
          x2 = tx;              y2 = tcy;
          const offset = Math.max(Math.abs(x2 - x1) * 0.45, 48);
          c1x = x1 + offset; c1y = y1;
          c2x = x2 - offset; c2y = y2;
        } else {
          // Source 왼쪽 -> Target 오른쪽 (역주행 꼬임 방지!)
          x1 = sx;              y1 = scy;
          x2 = tx + NODE_WIDTH; y2 = tcy;
          const offset = Math.max(Math.abs(x2 - x1) * 0.45, 48);
          c1x = x1 - offset; c1y = y1;
          c2x = x2 + offset; c2y = y2;
        }
      } else {
        // 세로 배치가 주를 이룰 때 -> 상/하 포트 연결
        if (dy >= 0) {
          // Source 아래쪽 -> Target 위쪽
          x1 = scx; y1 = sy + NODE_HEIGHT;
          x2 = tcx; y2 = ty;
          const offset = Math.max(Math.abs(y2 - y1) * 0.45, 48);
          c1x = x1; c1y = y1 + offset;
          c2x = x2; c2y = y2 - offset;
        } else {
          // Source 위쪽 -> Target 아래쪽
          x1 = scx; y1 = sy;
          x2 = tcx; y2 = ty + NODE_HEIGHT;
          const offset = Math.max(Math.abs(y2 - y1) * 0.45, 48);
          c1x = x1; c1y = y1 - offset;
          c2x = x2; c2y = y2 + offset;
        }
      }

      return {
        x1, y1, x2, y2,
        d: `M ${x1} ${y1} C ${c1x} ${c1y}, ${c2x} ${c2y}, ${x2} ${y2}`
      };
    }

    function renderMapSvgEdges(mapTasks) {
      let paths = '';
      mapTasks.forEach(target => {
        const deps = Array.isArray(target.dependencies) ? target.dependencies : [];
        deps.forEach(sourceId => {
          const source = mapTasks.find(t => String(t.id) === String(sourceId));
          if (!source) return;

          const geom = computeSmartEdgeGeometry(source, target);
          const isDone = source.status === 'done';
          const color = isDone ? '#34d399' : '#818cf8';

          paths += `
            <g class="edge-group" onclick="handleRemoveDependency('${target.id}', '${source.id}')">
              <title>클릭하여 연결 해제 (${escapeHTML(source.title)} → ${escapeHTML(target.title)})</title>
              <path d="${geom.d}" class="edge-bg"></path>
              <path d="${geom.d}"
                    class="edge-line ${isDone ? '' : 'edge-animated'}"
                    stroke="${color}"
                    marker-end="url(#${isDone ? 'arrow-done' : 'arrow-wait'})"></path>
              <circle cx="${geom.x1}" cy="${geom.y1}" r="3.5" fill="${color}"></circle>
            </g>
          `;
        });
      });
      return paths;
    }

    // Canvas Background Panning
    function handleViewportPanStart(e) {
      if (e.target.closest('.map-node') || e.target.closest('.edge-group')) return;
      const vp = document.getElementById('mapCanvasViewport');
      if (!vp) return;
      isPanningCanvas = true;
      panStartX = e.clientX;
      panStartY = e.clientY;
      panScrollLeft = vp.scrollLeft;
      panScrollTop = vp.scrollTop;
    }

    function handleNodeMouseDown(e, taskId) {
      if (e.button !== 0 || isConnectMode || e.shiftKey) return;
      e.stopPropagation();
      const nodeEl = document.getElementById(`node-${taskId}`);
      if (!nodeEl) return;
      draggingTaskId = taskId;
      const rect = nodeEl.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
    }

    function handleCanvasMouseMove(e) {
      if (isPanningCanvas && !draggingTaskId) {
        const vp = document.getElementById('mapCanvasViewport');
        if (vp) {
          vp.scrollLeft = panScrollLeft - (e.clientX - panStartX);
          vp.scrollTop = panScrollTop - (e.clientY - panStartY);
        }
        return;
      }

      if (!draggingTaskId) return;
      const surface = document.getElementById('mapCanvasSurface');
      const nodeEl = document.getElementById(`node-${draggingTaskId}`);
      if (!surface || !nodeEl) return;

      const surfRect = surface.getBoundingClientRect();
      const rawX = Math.max(20, Math.round(e.clientX - surfRect.left - dragOffsetX));
      const rawY = Math.max(20, Math.round(e.clientY - surfRect.top - dragOffsetY));

      nodeEl.style.left = `${rawX}px`;
      nodeEl.style.top = `${rawY}px`;

      const task = currentTasks.find(t => String(t.id) === String(draggingTaskId));
      if (task) {
        task.pos_x = rawX;
        task.pos_y = rawY;
        const svg = document.getElementById('mapEdgesSvg');
        if (svg) {
          const mapTasks = currentTasks.filter(t => t.in_map);
          svg.innerHTML = `
            <defs>

    async function handleCanvasMouseUp() {
      isPanningCanvas = false;
      if (!draggingTaskId) return;
      const movedId = draggingTaskId;
      draggingTaskId = null;

      const task = currentTasks.find(t => String(t.id) === String(movedId));
      if (task) {
        const safePos = findNonOverlappingPosition(task.pos_x, task.pos_y, task.id);
        task.pos_x = safePos.x;
        task.pos_y = safePos.y;
        renderWorkflowMapView();
        if (sbClient) {
          await sbClient.from('tasks').update({ pos_x: safePos.x, pos_y: safePos.y }).eq('id', task.id);
        }
      }
    }

    function renderMinimapNodes(mapTasks) {
      const scale = 0.068;
      return mapTasks.map(t => {
        const left = Math.round((t.pos_x || 380) * scale);
        const top = Math.round((t.pos_y || 160) * scale);
        const color = t.status === 'done' ? 'bg-emerald-400' : (t.status === 'in_progress' ? 'bg-blue-400' : 'bg-indigo-400');
        return `<div class="absolute ${color} rounded-xs" style="left:${left}px; top:${top}px; width:18px; height:8px;"></div>`;
      }).join('');
    }

    function updateMinimapViewport() {
      const vp = document.getElementById('mapCanvasViewport');
      const rect = document.getElementById('minimapViewportRect');
      if (!vp || !rect) return;
      const scale = 0.068;
      rect.style.left = `${Math.round(vp.scrollLeft * scale)}px`;
      rect.style.top = `${Math.round(vp.scrollTop * scale)}px`;
      rect.style.width = `${Math.min(188, Math.round(vp.clientWidth * scale))}px`;
      rect.style.height = `${Math.min(114, Math.round(vp.clientHeight * scale))}px`;
    }

    function handleMinimapClick(e) {
      const vp = document.getElementById('mapCanvasViewport');
      const box = document.getElementById('minimapBox');
      if (!vp || !box) return;
      const r = box.getBoundingClientRect();
      const clickX = (e.clientX - r.left) / 0.068;
      const clickY = (e.clientY - r.top) / 0.068;
      vp.scrollTo({ left: Math.max(0, clickX - vp.clientWidth / 2), top: Math.max(0, clickY - vp.clientHeight / 2), behavior: 'smooth' });
    }

    function fitCanvasToNodes() {
      const vp = document.getElementById('mapCanvasViewport');
      const mapTasks = currentTasks.filter(t => t.in_map);
      if (!vp || mapTasks.length === 0) return;
      const minX = Math.min(...mapTasks.map(t => t.pos_x || 380));
      const minY = Math.min(...mapTasks.map(t => t.pos_y || 160));
      vp.scrollTo({ left: Math.max(0, minX - 340), top: Math.max(0, minY - 100), behavior: 'smooth' });
    }

    function toggleConnectMode() {
      isConnectMode = !isConnectMode;
      connectSourceTaskId = null;
      renderWorkflowMapView();
    }

    function startConnectFromNode(taskId) {
      isConnectMode = true;
      connectSourceTaskId = taskId;
      renderWorkflowMapView();
      showToast('연결할 후행 업무 카드를 클릭하세요.');
    }

    async function handleNodeClick(e, taskId) {
      if (!isConnectMode && !e.shiftKey) return;
      e.stopPropagation();

      if (!connectSourceTaskId) {
        connectSourceTaskId = taskId;
        renderWorkflowMapView();
        return;
      }
      if (String(connectSourceTaskId) === String(taskId)) {
        connectSourceTaskId = null;
        renderWorkflowMapView();
        return;
      }

      const targetTask = currentTasks.find(t => String(t.id) === String(taskId));
      if (targetTask) {
        const deps = Array.isArray(targetTask.dependencies) ? [...targetTask.dependencies] : [];
        if (!deps.some(d => String(d) === String(connectSourceTaskId))) {
          deps.push(connectSourceTaskId);
          targetTask.dependencies = deps;
          await sbClient.from('tasks').update({ dependencies: deps }).eq('id', targetTask.id);
          showToast('선후 화살표가 연결되었습니다.');
        }
      }
      connectSourceTaskId = null;
      isConnectMode = false;
      renderWorkflowMapView();
    }

    async function handleRemoveDependency(targetId, sourceId) {
      const target = currentTasks.find(t => String(t.id) === String(targetId));
      if (!target) return;
      const deps = (target.dependencies || []).filter(d => String(d) !== String(sourceId));
      target.dependencies = deps;
      renderWorkflowMapView();
      await sbClient.from('tasks').update({ dependencies: deps }).eq('id', target.id);
      showToast('화살표 연결이 해제되었습니다.');
    }

    async function placeTaskOnMap(taskId) {
      const task = currentTasks.find(t => String(t.id) === String(taskId));
      if (!task) return;
      const safePos = findNonOverlappingPosition(360, 120, task.id);

      task.in_map = true;
      task.pos_x = safePos.x;
      task.pos_y = safePos.y;
      task.dependencies = [];
      renderWorkflowMapView();
      await sbClient.from('tasks').update({ in_map: true, pos_x: safePos.x, pos_y: safePos.y, dependencies: [] }).eq('id', task.id);
    }

    async function removeTaskFromMapToTray(taskId) {
      const task = currentTasks.find(t => String(t.id) === String(taskId));
      if (!task) return;
      task.in_map = false;
      task.dependencies = [];

      const affected = currentTasks.filter(t => Array.isArray(t.dependencies) && t.dependencies.some(d => String(d) === String(taskId)));
      for (const other of affected) {
        other.dependencies = other.dependencies.filter(d => String(d) !== String(taskId));
        await sbClient.from('tasks').update({ dependencies: other.dependencies }).eq('id', other.id);
      }

      await sbClient.from('tasks').update({ in_map: false, dependencies: [] }).eq('id', task.id);
      renderActiveViewport();
      showToast('트레이로 이동하며 기존 화살표 연결이 초기화되었습니다.');
    }

    async function handleDocDrop(e) {
      e.preventDefault();
      document.getElementById('docsSidebarDropzone')?.classList.remove('dropzone-active');
      const files = Array.from(e.dataTransfer.files || []);
      if (files.length === 0) return;

      showToast(`${files.length}개 파일을 문서함에 등록 중입니다...`);
      for (const file of files) {
        let textContent = '';
        if (file.type.startsWith('text/') || /\.(md|txt|csv|json)$/i.test(file.name)) {
          textContent = await file.text();
        }
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${currentProjectId}/docs/${Date.now()}_${safeName}`;
        let uploadedFiles = [];

        const { error: upErr } = await sbClient.storage.from('attachments').upload(path, file);
        if (!upErr) {
          const { data: pub } = sbClient.storage.from('attachments').getPublicUrl(path);
          uploadedFiles.push({ name: file.name, url: pub.publicUrl });
        }

        const { data: newDoc } = await sbClient.from('docs').insert([{
          project_id: currentProjectId,
          title: file.name.replace(/\.[^/.]+$/, ''),
          category: '드롭 파일',
          content: textContent || `첨부된 파일(${file.name})을 상단 링크에서 열람하세요.`,
          files: uploadedFiles,
          agenda: [],
          updated_by: currentUserName
        }]).select().single();

        if (newDoc) {
          currentDocs.unshift(newDoc);
          activeDocId = newDoc.id;
        }
      }
      renderDocsWikiView();
      showToast('드롭한 파일이 팀 문서함에 등록되었습니다.');
    }

    async function handleCreateDoc(isPinned = false) {
      const { data, error } = await sbClient.from('docs').insert([{
        project_id: currentProjectId,
        title: isPinned ? '📌 새 팀 공지사항' : '새 회의록 / 문서',
        category: isPinned ? '필수 공지' : '회의록',
        is_pinned: isPinned,
        content: '',
        files: [],
        agenda: [],
        updated_by: currentUserName
      }]).select().single();

      if (!error && data) {
        currentDocs.unshift(data);
        activeDocId = data.id;
        renderDocsWikiView();
      }
    }

    async function handleTogglePinDoc(docId) {
      const doc = currentDocs.find(d => String(d.id) === String(docId));
      if (!doc) return;
      doc.is_pinned = !doc.is_pinned;
      await sbClient.from('docs').update({ is_pinned: doc.is_pinned }).eq('id', docId);
      renderDocsWikiView();
      showToast(doc.is_pinned ? '상단 고정 공지로 설정되었습니다.' : '상단 고정이 해제되었습니다.');
    }

    async function handleSaveDoc(docId) {
      const title = document.getElementById('docTitleInput').value.trim() || '제목 없음';
      const category = document.getElementById('docCategoryInput').value.trim() || '문서';
      const content = document.getElementById('docContentInput').value;

    async function handleAddDocAgenda(e, docId) {
      e.preventDefault();
      const input = document.getElementById('docAgendaInput');
      const text = input.value.trim();
      if (!text) return;
      const doc = currentDocs.find(d => String(d.id) === String(docId));
      if (!doc) return;
      const agenda = [...(doc.agenda || []), { text, done: false }];
      doc.agenda = agenda;
      input.value = '';
      renderDocsWikiView();
      await sbClient.from('docs').update({ agenda }).eq('id', docId);
    }

    async function handleToggleDocAgenda(docId, idx) {
      const doc = currentDocs.find(d => String(d.id) === String(docId));
      if (!doc || !doc.agenda?.[idx]) return;
      doc.agenda[idx].done = !doc.agenda[idx].done;
      renderDocsWikiView();
      await sbClient.from('docs').update({ agenda: doc.agenda }).eq('id', docId);
    }

    async function handleRemoveDocAgenda(docId, idx) {
      const doc = currentDocs.find(d => String(d.id) === String(docId));
      if (!doc) return;
      doc.agenda.splice(idx, 1);
      renderDocsWikiView();
      await sbClient.from('docs').update({ agenda: doc.agenda }).eq('id', docId);
    }

    async function handleDeleteDoc(docId) {

      await sbClient.from('docs').delete().eq('id', docId);

    async function handleCreateTask(e) {
      e.preventDefault();
      const btn = document.getElementById('createTaskSubmitBtn');
      btn.disabled = true;
      btn.textContent = '등록 중...';

      try {
        const title = document.getElementById('taskTitleInput').value.trim();
        const description = document.getElementById('taskDescInput').value.trim();
        const assignee_name = document.getElementById('taskAssigneeSelect').value || null;
        const priority = document.getElementById('taskPrioritySelect').value;
        const label = document.getElementById('taskLabelInput').value.trim() || '일반';
        const due_date = document.getElementById('taskDueDateInput').value || null;
        const in_map = document.getElementById('taskPutInMapCheck').checked;

        const safePos = findNonOverlappingPosition(360, 140, null);

        const uploadedFiles = [];
        for (const file of creationStagedFiles) {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `${currentProjectId}/tasks/${Date.now()}_${safeName}`;
          const { error: upErr } = await sbClient.storage.from('attachments').upload(path, file);
          if (!upErr) {
            const { data } = sbClient.storage.from('attachments').getPublicUrl(path);
            uploadedFiles.push({ name: file.name, url: data.publicUrl });
          }
        }

        const { error } = await sbClient.from('tasks').insert([{
          project_id: currentProjectId,
          title, description, assignee_name, priority, label, due_date,
          status: 'todo', in_map, pos_x: safePos.x, pos_y: safePos.y,
          dependencies: [], checklist: [], comments: [],
          files: uploadedFiles,
          links: creationStagedLinks
        }]);

        if (error) throw error;
        closeModal('createTaskModal');
        showToast('새 업무가 등록되었습니다.');
      } catch (err) {
        showToast('생성 실패: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '업무 등록';
      }
    }

    async function handleUploadStagedDetailFiles() {
      if (detailStagedFiles.length === 0 || !activeTask) return;
      const btn = document.getElementById('detailQueueUploadBtn');
      btn.disabled = true;
      btn.textContent = '일괄 업로드 중...';

      try {
        const uploaded = [...(activeTask.files || [])];
        for (const file of detailStagedFiles) {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `${currentProjectId}/${activeTask.id}/${Date.now()}_${safeName}`;
          const { error } = await sbClient.storage.from('attachments').upload(path, file);
          if (error) throw error;
          const { data } = sbClient.storage.from('attachments').getPublicUrl(path);
          uploaded.push({ name: file.name, url: data.publicUrl });

        detailStagedFiles = [];
        renderDetailStagedQueue();
        await handleTaskFieldUpdate('files', uploaded);

        showToast('업로드 실패: ' + err.message, 'error');

    async function handleCreateChannel() {
      const name = prompt('새 토픽 채널 이름을 입력하세요 (예: 디자인, 백엔드, 공지):');
      if (!name || !name.trim()) return;
      const clean = name.trim().replace(/^#/, '');
      const channels = Array.isArray(currentProject.channels) ? [...currentProject.channels] : ['일반', '기획-논의', '제작-개발'];
      if (!channels.includes(clean)) {
        channels.push(clean);
        currentProject.channels = channels;
        activeChatChannel = clean;
        renderChatDrawerUI();
        await sbClient.from('projects').update({ channels }).eq('id', currentProjectId);
      }
    }

    function renderChatDrawerUI() {
      const chList = document.getElementById('chatChannelsList');
      const dmList = document.getElementById('chatDmMembersList');
      const titleEl = document.getElementById('activeChatRoomTitle');
      const msgBox = document.getElementById('chatMessagesList');
      if (!chList || !msgBox) return;

      const channels = Array.isArray(currentProject?.channels) ? currentProject.channels : ['일반', '기획-논의', '제작-개발'];

      chList.innerHTML = channels.map(ch => `
        <button onclick="selectChatChannel('${escapeHTML(ch)}')" class="w-full text-left px-2.5 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-1.5 ${activeChatChannel === ch ? 'bg-indigo-600 text-white font-semibold shadow' : 'text-slate-400 hover:bg-white/[0.05] hover:text-slate-200'}">
          <span class="opacity-60">#</span> <span class="truncate">${escapeHTML(ch)}</span>
        </button>
      `).join('');

      const otherMembers = currentMembers.filter(m => m.name !== currentUserName);
      dmList.innerHTML = otherMembers.length === 0
        ? `<div class="text-[11px] text-slate-500 px-2 py-2 leading-relaxed">팀원이 합류하면 1:1 DM이 표시됩니다.</div>`
        : otherMembers.map(m => {
          const pair = [currentUserName, m.name].sort();
          const dmKey = `DM:${pair[0]}&${pair[1]}`;
          const isActive = activeChatChannel === dmKey;
          return `
            <button onclick="selectDmMember('${escapeHTML(m.name)}')" class="w-full text-left px-2.5 py-1.5 rounded-xl text-xs font-medium transition flex items-center gap-2 ${isActive ? 'bg-indigo-600 text-white font-semibold shadow' : 'text-slate-400 hover:bg-white/[0.05] hover:text-slate-200'}">
              <span class="w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
              <span class="truncate">${escapeHTML(m.name)}</span>
            </button>
          `;
        }).join('');

      if (activeChatChannel.startsWith('DM:')) {
        const names = activeChatChannel.replace('DM:', '').split('&');
        const partner = names.find(n => n !== currentUserName) || names[0];
        titleEl.textContent = `@ ${partner}`;
      } else {
        titleEl.textContent = `# ${activeChatChannel}`;
      }

      const roomMsgs = currentMessages.filter(m => (m.channel || '일반') === activeChatChannel);

      msgBox.innerHTML = roomMsgs.length === 0
        ? `<div class="text-center text-xs text-slate-500 py-12">첫 메시지를 남겨 대화를 시작하세요!</div>`
        : roomMsgs.map(m => {
          const isMe = m.sender_name === currentUserName;
          return `
            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
              <span class="text-[11px] text-slate-400 mb-1 px-1">${escapeHTML(m.sender_name)}</span>
              <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-sm ${isMe ? 'bg-gradient-to-r from-indigo-600 to-violet-600 text-white shadow-md' : 'bg-white/[0.06] border border-white/[0.08] text-slate-100'}">
                ${m.task_ref_id ? `
                  <div onclick="openTaskDetailModal('${m.task_ref_id}')" class="mb-1.5 px-2.5 py-1 rounded-lg bg-black/30 text-xs text-indigo-200 cursor-pointer hover:underline flex items-center gap-1.5">
                    <i class="fa-solid fa-link text-[10px]"></i> ${escapeHTML(m.task_ref_title || '업무 바로가기')}
                  </div>
                ` : ''}
                <div class="leading-relaxed">${escapeHTML(m.content)}</div>
              </div>
            </div>
          `;
        }).join('');
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const content = input.value.trim();
      if (!content) return;

      const payload = {
        project_id: currentProjectId,
        channel: activeChatChannel,
        sender_name: currentUserName,
        content,
        task_ref_id: chatTaskRef ? chatTaskRef.id : null,

      clearChatTaskRef();
      await sbClient.from('messages').insert([payload]);

    function openInviteModal() {
      const url = window.location.origin + window.location.pathname + `?p=${currentProjectId}`;
      document.getElementById('inviteUrlField').value = url;
      document.getElementById('inviteCodeField').textContent = currentProjectId;
      const modal = document.getElementById('inviteModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function copyInviteUrl() {
      const input = document.getElementById('inviteUrlField');
      navigator.clipboard.writeText(input.value);
      showToast('초대 링크가 복사되었습니다.');
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function showToast(msg, type = 'info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-2xl text-sm font-semibold transition-all duration-200 opacity-100 ${
        type === 'error' ? 'bg-rose-600 text-white' : 'surface-panel text-white'
      }`;
      setTimeout(() => { t.classList.replace('opacity-100', 'opacity-0'); }, 2500);
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
