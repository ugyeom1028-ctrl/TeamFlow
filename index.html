          <!-- Right Sidebar: Meeting Agenda Checker -->
          ${activeDoc ? `
            <div class="w-80 border-l border-zinc-800 bg-[#0c0c0f] p-4 flex flex-col shrink-0">
              <div class="pb-3 mb-3 border-b border-zinc-800 flex items-center justify-between">
                <span class="text-sm font-bold text-zinc-100 flex items-center gap-2">
                  <i class="fa-solid fa-clipboard-check text-emerald-400"></i> 회의 안건 체커 (Agenda)
                </span>
                <span class="text-xs font-mono text-zinc-400">
                  ${(activeDoc.agenda || []).filter(a => a.done).length}/${(activeDoc.agenda || []).length}
                </span>
              </div>

              <form onsubmit="handleAddDocAgenda(event, '${activeDoc.id}')" class="flex gap-1.5 mb-3">
                <input type="text" id="docAgendaInput" placeholder="논의할 안건 추가..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
                <button type="submit" class="px-3 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">추가</button>
              </form>

              <div class="flex-1 overflow-y-auto space-y-2">
                ${(activeDoc.agenda || []).length === 0 ? `
                  <div class="text-xs text-zinc-500 text-center py-8">등록된 회의 안건이 없습니다.</div>
                ` : (activeDoc.agenda || []).map((ag, idx) => `
                  <div class="flex items-start justify-between gap-2 p-2.5 rounded-xl bg-zinc-900/70 border border-zinc-800 text-xs">
                    <label class="flex items-start gap-2 cursor-pointer flex-1">
                      <input type="checkbox" ${ag.done ? 'checked' : ''} onchange="handleToggleDocAgenda('${activeDoc.id}', ${idx})" class="mt-0.5 rounded bg-zinc-950 border-zinc-700 text-emerald-500">
                      <span class="leading-snug ${ag.done ? 'line-through text-zinc-500' : 'text-zinc-200'}">${escapeHTML(ag.text)}</span>
                    </label>
                    <button onclick="handleRemoveDocAgenda('${activeDoc.id}', ${idx})" class="text-zinc-600 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}
        </div>
      `;
    }

    function selectDoc(id) { activeDocId = id; renderDocsWikiView(); }

    function handleDocDragOver(e) {
      e.preventDefault();
      document.getElementById('docsSidebarDropzone')?.classList.add('dropzone-active');
    }
    function handleDocDragLeave(e) {
      e.preventDefault();
      document.getElementById('docsSidebarDropzone')?.classList.remove('dropzone-active');
    }

    // #4: 문서함에 파일 드래그 앤 드롭 시 즉시 새 문서 생성 & 파일 업로드
    async function handleDocDrop(e) {
      e.preventDefault();
      document.getElementById('docsSidebarDropzone')?.classList.remove('dropzone-active');
      const files = Array.from(e.dataTransfer.files || []);
      if (files.length === 0) return;

      showToast(`${files.length}개 파일을 문서함에 등록 중입니다...`);
      for (const file of files) {
        let textContent = '';
        if (file.type.startsWith('text/') || /\.(md|txt|csv|json)$/i.test(file.name)) {
          textContent = await file.text();
        }
        const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
        const path = `${currentProjectId}/docs/${Date.now()}_${safeName}`;
        let uploadedFiles = [];

        const { error: upErr } = await sbClient.storage.from('attachments').upload(path, file);
        if (!upErr) {
          const { data: pub } = sbClient.storage.from('attachments').getPublicUrl(path);
          uploadedFiles.push({ name: file.name, url: pub.publicUrl });
        }

        const { data: newDoc } = await sbClient.from('docs').insert([{
          project_id: currentProjectId,
          title: file.name.replace(/\.[^/.]+$/, ''),
          category: '드롭 파일',
          content: textContent || `첨부된 파일(${file.name})을 상단 링크에서 열람하세요.`,
          files: uploadedFiles,
          agenda: [],
          updated_by: currentUserName
        }]).select().single();

        if (newDoc) {
          currentDocs.unshift(newDoc);
          activeDocId = newDoc.id;
        }
      }
      renderDocsWikiView();
      showToast('드롭한 파일이 팀 문서함에 등록되었습니다.');
    }

    async function handleCreateDoc(isPinned = false) {
      const { data, error } = await sbClient.from('docs').insert([{
        project_id: currentProjectId,
        title: isPinned ? '📌 새 팀 공지사항' : '새 회의록 / 문서',
        category: isPinned ? '필수 공지' : '회의록',
        is_pinned: isPinned,
        content: '',
        files: [],
        agenda: [],
        updated_by: currentUserName
      }]).select().single();

      if (!error && data) {
        currentDocs.unshift(data);
        activeDocId = data.id;
        renderDocsWikiView();
      }
    }

    async function handleTogglePinDoc(docId) {
      const doc = currentDocs.find(d => String(d.id) === String(docId));
      if (!doc) return;
      doc.is_pinned = !doc.is_pinned;
      await sbClient.from('docs').update({ is_pinned: doc.is_pinned }).eq('id', docId);
      renderDocsWikiView();
      showToast(doc.is_pinned ? '상단 고정 공지로 설정되었습니다.' : '상단 고정이 해제되었습니다.');
    }

    async function handleSaveDoc(docId) {
      const title = document.getElementById('docTitleInput').value.trim() || '제목 없음';
      const category = document.getElementById('docCategoryInput').value.trim() || '문서';
      const content = document.getElementById('docContentInput').value;

      await sbClient.from('docs').update({
        title, category, content, updated_by: currentUserName, updated_at: new Date().toISOString()
      }).eq('id', docId);
      showToast('문서가 저장되었습니다.');
    }

    async function handleAddDocAgenda(e, docId) {
      e.preventDefault();
      const input = document.getElementById('docAgendaInput');
      const text = input.value.trim();
      if (!text) return;
      const doc = currentDocs.find(d => String(d.id) === String(docId));
      if (!doc) return;
      const agenda = [...(doc.agenda || []), { text, done: false }];
      doc.agenda = agenda;
      input.value = '';
      renderDocsWikiView();
      await sbClient.from('docs').update({ agenda }).eq('id', docId);
    }

    async function handleToggleDocAgenda(docId, idx) {
      const doc = currentDocs.find(d => String(d.id) === String(docId));
      if (!doc || !doc.agenda?.[idx]) return;
      doc.agenda[idx].done = !doc.agenda[idx].done;
      renderDocsWikiView();
      await sbClient.from('docs').update({ agenda: doc.agenda }).eq('id', docId);
    }

    async function handleRemoveDocAgenda(docId, idx) {
      const doc = currentDocs.find(d => String(d.id) === String(docId));
      if (!doc) return;
      doc.agenda.splice(idx, 1);
      renderDocsWikiView();
      await sbClient.from('docs').update({ agenda: doc.agenda }).eq('id', docId);
    }

    async function handleDeleteDoc(docId) {
      if (!confirm('이 문서를 삭제하시겠습니까?')) return;
      await sbClient.from('docs').delete().eq('id', docId);
      activeDocId = null;
      const { data } = await sbClient.from('docs').select('*').eq('project_id', currentProjectId).order('is_pinned', { ascending: false }).order('updated_at', { ascending: false });
      currentDocs = data || [];
      renderDocsWikiView();
    }

    // ==========================================
    // 6. TASK CREATION & STAGED FILE QUEUE (#2 & #5)
    // ==========================================
    function openCreateTaskModal() {
      const sel = document.getElementById('taskAssigneeSelect');
      sel.innerHTML = '<option value="">미정</option>' + currentMembers.map(m => `<option value="${escapeHTML(m.name)}">${escapeHTML(m.name)}</option>`).join('');
      document.getElementById('taskTitleInput').value = '';
      document.getElementById('taskDescInput').value = '';
      document.getElementById('taskDueDateInput').value = '';
      document.getElementById('taskPutInMapCheck').checked = (currentView === 'map');

      creationStagedFiles = [];
      creationStagedLinks = [];
      renderCreationStagedLists();

      const modal = document.getElementById('createTaskModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function handleStageCreationFiles(e) {
      const added = Array.from(e.target.files || []);
      creationStagedFiles.push(...added);
      e.target.value = '';
      renderCreationStagedLists();
    }

    function removeStagedCreationFile(idx) {
      creationStagedFiles.splice(idx, 1);
      renderCreationStagedLists();
    }

    function handleStageCreationLink() {
      const tIn = document.getElementById('createLinkTitleInput');
      const uIn = document.getElementById('createLinkUrlInput');
      const url = uIn.value.trim();
      const title = tIn.value.trim() || url;
      if (!url) return showToast('링크 URL을 입력하세요.', 'error');
      creationStagedLinks.push({ title, url });
      tIn.value = ''; uIn.value = '';
      renderCreationStagedLists();
    }

    function removeStagedCreationLink(idx) {
      creationStagedLinks.splice(idx, 1);
      renderCreationStagedLists();
    }

    function renderCreationStagedLists() {
      const fBox = document.getElementById('createStagedFilesList');
      fBox.innerHTML = creationStagedFiles.map((f, i) => `
        <div class="flex items-center justify-between px-3 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs">
          <span class="text-indigo-300 truncate"><i class="fa-regular fa-file mr-1.5"></i>${escapeHTML(f.name)} <span class="text-zinc-500">(대기열)</span></span>
          <button type="button" onclick="removeStagedCreationFile(${i})" class="text-zinc-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');

      const lBox = document.getElementById('createStagedLinksList');
      lBox.innerHTML = creationStagedLinks.map((l, i) => `
        <div class="flex items-center justify-between px-3 py-1.5 rounded-lg bg-zinc-950 border border-zinc-800 text-xs">
          <span class="text-cyan-300 truncate"><i class="fa-solid fa-link mr-1.5"></i>${escapeHTML(l.title)}</span>
          <button type="button" onclick="removeStagedCreationLink(${i})" class="text-zinc-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');
    }

    async function handleCreateTask(e) {
      e.preventDefault();
      const btn = document.getElementById('createTaskSubmitBtn');
      btn.disabled = true;
      btn.textContent = '등록 중...';

      try {
        const title = document.getElementById('taskTitleInput').value.trim();
        const description = document.getElementById('taskDescInput').value.trim();
        const assignee_name = document.getElementById('taskAssigneeSelect').value || null;
        const priority = document.getElementById('taskPrioritySelect').value;
        const label = document.getElementById('taskLabelInput').value.trim() || '일반';
        const due_date = document.getElementById('taskDueDateInput').value || null;
        const in_map = document.getElementById('taskPutInMapCheck').checked;

        const safePos = findNonOverlappingPosition(100, 100, null);

        // Upload staged files if any
        const uploadedFiles = [];
        for (const file of creationStagedFiles) {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `${currentProjectId}/tasks/${Date.now()}_${safeName}`;
          const { error: upErr } = await sbClient.storage.from('attachments').upload(path, file);
          if (!upErr) {
            const { data } = sbClient.storage.from('attachments').getPublicUrl(path);
            uploadedFiles.push({ name: file.name, url: data.publicUrl });
          }
        }

        const { error } = await sbClient.from('tasks').insert([{
          project_id: currentProjectId,
          title, description, assignee_name, priority, label, due_date,
          status: 'todo', in_map, pos_x: safePos.x, pos_y: safePos.y,
          dependencies: [], checklist: [], comments: [],
          files: uploadedFiles,
          links: creationStagedLinks
        }]);

        if (error) throw error;
        closeModal('createTaskModal');
        showToast('새 업무가 등록되었습니다.');
      } catch (err) {
        showToast('생성 실패: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
        btn.textContent = '업무 등록';
      }
    }

    // ==========================================
    // 7. TASK DETAIL MODAL & STAGED FILE UPLOAD (#2)
    // ==========================================
    function openTaskDetailModal(taskId) {
      activeTask = currentTasks.find(t => String(t.id) === String(taskId));
      if (!activeTask) return;
      detailStagedFiles = [];
      renderTaskDetailModalContent();
      const modal = document.getElementById('taskDetailModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function handleStageDetailFiles(e) {
      const files = Array.from(e.target.files || []);
      detailStagedFiles.push(...files);
      e.target.value = '';
      renderDetailStagedQueue();
    }

    function removeStagedDetailFile(idx) {
      detailStagedFiles.splice(idx, 1);
      renderDetailStagedQueue();
    }

    function renderDetailStagedQueue() {
      const box = document.getElementById('detailStagedFilesList');
      const uploadBtn = document.getElementById('detailQueueUploadBtn');
      const countSpan = document.getElementById('detailQueueCount');

      if (detailStagedFiles.length === 0) {
        box.innerHTML = '';
        uploadBtn.classList.add('hidden');
      } else {
        uploadBtn.classList.remove('hidden');
        countSpan.textContent = detailStagedFiles.length;
        box.innerHTML = detailStagedFiles.map((f, i) => `
          <div class="flex items-center justify-between px-3 py-1.5 rounded-lg bg-indigo-950/30 border border-indigo-500/30 text-xs">
            <span class="text-indigo-200 truncate"><i class="fa-solid fa-clock mr-1.5 text-indigo-400"></i>[업로드 대기] ${escapeHTML(f.name)}</span>
            <button onclick="removeStagedDetailFile(${i})" class="text-zinc-400 hover:text-rose-400 ml-2"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `).join('');
      }
    }

    async function handleUploadStagedDetailFiles() {
      if (detailStagedFiles.length === 0 || !activeTask) return;
      const btn = document.getElementById('detailQueueUploadBtn');
      btn.disabled = true;
      btn.textContent = '일괄 업로드 중...';

      try {
        const uploaded = [...(activeTask.files || [])];
        for (const file of detailStagedFiles) {
          const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
          const path = `${currentProjectId}/${activeTask.id}/${Date.now()}_${safeName}`;
          const { error } = await sbClient.storage.from('attachments').upload(path, file);
          if (error) throw error;
          const { data } = sbClient.storage.from('attachments').getPublicUrl(path);
          uploaded.push({ name: file.name, url: data.publicUrl });
        }
        detailStagedFiles = [];
        renderDetailStagedQueue();
        await handleTaskFieldUpdate('files', uploaded);
        showToast('대기열의 모든 파일이 업로드되었습니다.');
      } catch (err) {
        showToast('업로드 실패: ' + err.message, 'error');
      } finally {
        btn.disabled = false;
      }
    }

    function renderTaskDetailModalContent() {
      if (!activeTask) return;
      const priMap = { urgent: '긴급', high: '높음', medium: '보통', low: '낮음' };
      document.getElementById('modalTaskTitle').textContent = activeTask.title;
      document.getElementById('modalTaskDesc').textContent = activeTask.description || '작성된 상세 설명이 없습니다.';
      document.getElementById('modalTaskLabelBadge').textContent = activeTask.label || '일반';

      const priBadge = document.getElementById('modalTaskPriorityBadge');
      priBadge.textContent = priMap[activeTask.priority || 'medium'];
      priBadge.className = `px-2.5 py-1 rounded-md text-xs font-semibold pri-${activeTask.priority || 'medium'}`;

      document.getElementById('modalStatusSelect').value = activeTask.status || 'todo';
      document.getElementById('modalPrioritySelect').value = activeTask.priority || 'medium';

      const assSel = document.getElementById('modalAssigneeSelect');
      assSel.innerHTML = '<option value="">미정</option>' + currentMembers.map(m => `<option value="${escapeHTML(m.name)}" ${m.name === activeTask.assignee_name ? 'selected' : ''}>${escapeHTML(m.name)}</option>`).join('');

      const mapBtn = document.getElementById('modalMapToggleBtn');
      if (activeTask.in_map) {
        mapBtn.textContent = '맵에 배치됨 (트레이로 빼기)';
        mapBtn.className = 'w-full px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-indigo-500/15 text-indigo-300 border border-indigo-500/30';
      } else {
        mapBtn.textContent = '트레이 보관중 (맵에 배치)';
        mapBtn.className = 'w-full px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800';
      }

      renderDetailStagedQueue();

      const checklist = Array.isArray(activeTask.checklist) ? activeTask.checklist : [];
      document.getElementById('modalChecklistContainer').innerHTML = checklist.length === 0
        ? `<div class="text-xs text-zinc-500">등록된 체크리스트가 없습니다.</div>`
        : checklist.map((item, idx) => `
          <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-zinc-900/70 border border-zinc-800 text-sm">
            <label class="flex items-center gap-2.5 cursor-pointer flex-1">
              <input type="checkbox" ${item.done ? 'checked' : ''} onchange="handleToggleCheckItem(${idx})" class="w-4 h-4 rounded bg-zinc-950 border-zinc-700 text-indigo-600">
              <span class="${item.done ? 'line-through text-zinc-500' : 'text-zinc-100'}">${escapeHTML(item.text)}</span>
            </label>
            <button onclick="handleRemoveCheckItem(${idx})" class="text-zinc-500 hover:text-rose-400 text-xs"><i class="fa-solid fa-xmark"></i></button>
          </div>
        `).join('');

      const files = activeTask.files || [];
      document.getElementById('modalFilesList').innerHTML = files.map((f, i) => `
        <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs">
          <a href="${f.url}" target="_blank" class="text-indigo-400 hover:underline truncate flex items-center gap-2"><i class="fa-regular fa-file"></i><span class="truncate">${escapeHTML(f.name)}</span></a>
          <button onclick="handleDeleteFile(${i})" class="text-zinc-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');

      const links = activeTask.links || [];
      document.getElementById('modalLinksList').innerHTML = links.map((l, i) => `
        <div class="flex items-center justify-between px-3 py-2 rounded-xl bg-zinc-900 border border-zinc-800 text-xs">
          <a href="${l.url}" target="_blank" class="text-cyan-400 hover:underline truncate flex items-center gap-2"><i class="fa-solid fa-link"></i><span class="truncate">${escapeHTML(l.title || l.url)}</span></a>
          <button onclick="handleDeleteLink(${i})" class="text-zinc-500 hover:text-rose-400"><i class="fa-solid fa-xmark"></i></button>
        </div>
      `).join('');

      const comments = Array.isArray(activeTask.comments) ? activeTask.comments : [];
      document.getElementById('modalCommentsList').innerHTML = comments.length === 0
        ? `<div class="text-xs text-zinc-500">아직 코멘트가 없습니다.</div>`
        : comments.map(c => `
          <div class="p-3 rounded-xl bg-zinc-900/70 border border-zinc-800 text-sm space-y-1">
            <div class="flex items-center justify-between text-xs text-zinc-500">
              <span class="font-bold text-zinc-300">${escapeHTML(c.author)}</span>
              <span>${c.time || ''}</span>
            </div>
            <div class="text-zinc-100">${escapeHTML(c.text)}</div>
          </div>
        `).join('');
    }

    async function handleTaskFieldUpdate(field, value) {
      if (!activeTask) return;
      activeTask[field] = value;
      renderTaskDetailModalContent();
      renderActiveViewport();
      await sbClient.from('tasks').update({ [field]: value }).eq('id', activeTask.id);
    }

    async function toggleActiveTaskInMap() {
      if (!activeTask) return;
      if (activeTask.in_map) {
        await removeTaskFromMapToTray(activeTask.id);
        renderTaskDetailModalContent();
      } else {
        await placeTaskOnMap(activeTask.id);
        renderTaskDetailModalContent();
      }
    }

    function toggleChecklistInput() {
      const form = document.getElementById('checklistAddForm');
      form.classList.toggle('hidden');
      form.classList.toggle('flex');
      if (!form.classList.contains('hidden')) document.getElementById('checklistInput').focus();
    }

    async function handleAddChecklistItem(e) {
      e.preventDefault();
      const input = document.getElementById('checklistInput');
      const text = input.value.trim();
      if (!text || !activeTask) return;
      const list = [...(activeTask.checklist || []), { text, done: false }];
      input.value = '';
      await handleTaskFieldUpdate('checklist', list);
    }

    async function handleToggleCheckItem(idx) {
      const list = [...(activeTask.checklist || [])];
      if (!list[idx]) return;
      list[idx].done = !list[idx].done;
      await handleTaskFieldUpdate('checklist', list);
    }

    async function handleRemoveCheckItem(idx) {
      const list = [...(activeTask.checklist || [])];
      list.splice(idx, 1);
      await handleTaskFieldUpdate('checklist', list);
    }

    async function handleAddComment(e) {
      e.preventDefault();
      const input = document.getElementById('commentInput');
      const text = input.value.trim();
      if (!text || !activeTask) return;
      const now = new Date();
      const time = `${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
      const comments = [...(activeTask.comments || []), { author: currentUserName, text, time }];
      input.value = '';
      await handleTaskFieldUpdate('comments', comments);
    }

    async function handleAddLink() {
      const tIn = document.getElementById('linkTitleInput');
      const uIn = document.getElementById('linkUrlInput');
      const url = uIn.value.trim();
      const title = tIn.value.trim() || url;
      if (!url) return;
      const links = [...(activeTask.links || []), { title, url }];
      tIn.value = ''; uIn.value = '';
      await handleTaskFieldUpdate('links', links);
    }

    async function handleDeleteFile(idx) {
      const files = [...(activeTask.files || [])];
      files.splice(idx, 1);
      await handleTaskFieldUpdate('files', files);
    }

    async function handleDeleteLink(idx) {
      const links = [...(activeTask.links || [])];
      links.splice(idx, 1);
      await handleTaskFieldUpdate('links', links);
    }

    async function handleDeleteTask() {
      if (!activeTask || !confirm('이 업무를 영구 삭제하시겠습니까?')) return;
      await sbClient.from('tasks').delete().eq('id', activeTask.id);
      closeModal('taskDetailModal');
      showToast('업무가 삭제되었습니다.');
    }

    // ==========================================
    // 8. DISCORD-STYLE MULTI-CHANNEL & DM CHAT (#3)
    // ==========================================
    function toggleChatDrawer() {
      isChatOpen = !isChatOpen;
      const drawer = document.getElementById('chatDrawer');
      if (isChatOpen) {
        drawer.classList.remove('hidden');
        drawer.classList.add('flex');
        document.getElementById('chatUnreadDot').classList.add('hidden');
        renderChatDrawerUI();
        document.getElementById('chatInput').focus();
      } else {
        drawer.classList.add('hidden');
        drawer.classList.remove('flex');
      }
    }

    function selectChatChannel(ch) {
      activeChatChannel = ch;
      renderChatDrawerUI();
    }

    function selectDmMember(memberName) {
      const pair = [currentUserName, memberName].sort();
      activeChatChannel = `DM:${pair[0]}&${pair[1]}`;
      renderChatDrawerUI();
    }

    async function handleCreateChannel() {
      const name = prompt('새 토픽/그룹 채널 이름을 입력하세요 (예: 디자인팀, 백엔드, 긴급이슈):');
      if (!name || !name.trim()) return;
      const clean = name.trim().replace(/^#/, '');
      const channels = Array.isArray(currentProject.channels) ? [...currentProject.channels] : ['일반', '기획-논의', '제작-개발'];
      if (!channels.includes(clean)) {
        channels.push(clean);
        currentProject.channels = channels;
        activeChatChannel = clean;
        renderChatDrawerUI();
        await sbClient.from('projects').update({ channels }).eq('id', currentProjectId);
      }
    }

    function renderChatDrawerUI() {
      const chList = document.getElementById('chatChannelsList');
      const dmList = document.getElementById('chatDmMembersList');
      const titleEl = document.getElementById('activeChatRoomTitle');
      const msgBox = document.getElementById('chatMessagesList');
      if (!chList || !msgBox) return;

      const channels = Array.isArray(currentProject?.channels) ? currentProject.channels : ['일반', '기획-논의', '제작-개발'];

      chList.innerHTML = channels.map(ch => `
        <button onclick="selectChatChannel('${escapeHTML(ch)}')" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5 ${activeChatChannel === ch ? 'bg-indigo-600 text-white font-semibold' : 'text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200'}">
          <span class="text-zinc-500">#</span> <span class="truncate">${escapeHTML(ch)}</span>
        </button>
      `).join('');

      const otherMembers = currentMembers.filter(m => m.name !== currentUserName);
      dmList.innerHTML = otherMembers.length === 0
        ? `<div class="text-[11px] text-zinc-600 px-2 py-2">다른 팀원이 합류하면 1:1 DM이 활성화됩니다.</div>`
        : otherMembers.map(m => {
          const pair = [currentUserName, m.name].sort();
          const dmKey = `DM:${pair[0]}&${pair[1]}`;
          const isActive = activeChatChannel === dmKey;
          return `
            <button onclick="selectDmMember('${escapeHTML(m.name)}')" class="w-full text-left px-2.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-2 ${isActive ? 'bg-indigo-600 text-white font-semibold' : 'text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200'}">
              <span class="w-2 h-2 rounded-full bg-emerald-500 shrink-0"></span>
              <span class="truncate">${escapeHTML(m.name)}</span>
            </button>
          `;
        }).join('');

      if (activeChatChannel.startsWith('DM:')) {
        const names = activeChatChannel.replace('DM:', '').split('&');
        const partner = names.find(n => n !== currentUserName) || names[0];
        titleEl.textContent = `@ ${partner} (1:1 대화)`;
      } else {
        titleEl.textContent = `# ${activeChatChannel}`;
      }

      const roomMsgs = currentMessages.filter(m => (m.channel || '일반') === activeChatChannel);

      msgBox.innerHTML = roomMsgs.length === 0
        ? `<div class="text-center text-xs text-zinc-500 py-12">이 채널의 첫 메시지를 남겨보세요!</div>`
        : roomMsgs.map(m => {
          const isMe = m.sender_name === currentUserName;
          return `
            <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
              <span class="text-xs text-zinc-500 mb-1 px-1">${escapeHTML(m.sender_name)}</span>
              <div class="max-w-[85%] rounded-2xl px-3.5 py-2.5 text-sm ${isMe ? 'bg-indigo-600 text-white' : 'bg-zinc-900 border border-zinc-800 text-zinc-100'}">
                ${m.task_ref_id ? `
                  <div onclick="openTaskDetailModal('${m.task_ref_id}')" class="mb-1.5 px-2.5 py-1 rounded-lg bg-black/30 text-xs text-indigo-200 cursor-pointer hover:underline flex items-center gap-1.5">
                    <i class="fa-solid fa-link text-[10px]"></i> ${escapeHTML(m.task_ref_title || '업무 바로가기')}
                  </div>
                ` : ''}
                <div class="leading-relaxed">${escapeHTML(m.content)}</div>
              </div>
            </div>
          `;
        }).join('');
      msgBox.scrollTop = msgBox.scrollHeight;
    }

    function shareActiveTaskToChat() {
      if (!activeTask) return;
      chatTaskRef = { id: activeTask.id, title: activeTask.title };
      closeModal('taskDetailModal');
      if (!isChatOpen) toggleChatDrawer();
      const banner = document.getElementById('chatTaskRefBanner');
      banner.classList.remove('hidden');
      banner.classList.add('flex');
      document.getElementById('chatTaskRefText').textContent = `🔗 언급된 업무: ${activeTask.title}`;
      document.getElementById('chatInput').focus();
    }

    function clearChatTaskRef() {
      chatTaskRef = null;
      const banner = document.getElementById('chatTaskRefBanner');
      banner.classList.add('hidden');
      banner.classList.remove('flex');
    }

    async function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const content = input.value.trim();
      if (!content) return;

      const payload = {
        project_id: currentProjectId,
        channel: activeChatChannel,
        sender_name: currentUserName,
        content,
        task_ref_id: chatTaskRef ? chatTaskRef.id : null,
        task_ref_title: chatTaskRef ? chatTaskRef.title : null
      };

      input.value = '';
      clearChatTaskRef();
      await sbClient.from('messages').insert([payload]);
    }

    // ==========================================
    // 9. UTILITIES
    // ==========================================
    function openInviteModal() {
      const url = window.location.origin + window.location.pathname + `?p=${currentProjectId}`;
      document.getElementById('inviteUrlField').value = url;
      document.getElementById('inviteCodeField').textContent = currentProjectId;
      const modal = document.getElementById('inviteModal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function copyInviteUrl() {
      const input = document.getElementById('inviteUrlField');
      navigator.clipboard.writeText(input.value);
      showToast('초대 링크가 복사되었습니다.');
    }

    function closeModal(id) {
      const m = document.getElementById(id);
      m.classList.add('hidden');
      m.classList.remove('flex');
    }

    function showToast(msg, type = 'info') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-xl shadow-2xl text-sm font-semibold transition-all duration-200 opacity-100 ${
        type === 'error' ? 'bg-rose-600 text-white' : 'bg-zinc-800 text-zinc-100 border border-zinc-700'
      }`;
      setTimeout(() => { t.classList.replace('opacity-100', 'opacity-0'); }, 2500);
    }

    function escapeHTML(str) {
      return String(str || '').replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
    }
  </script>
</body>
</html>
