<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeamFlow — All-in-One Project Workspace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg-base: #09090b;
      --bg-surface: #121215;
      --bg-elevated: #18181c;
      --border-hairline: #27272a;
      --accent: #6366f1;
    }
    * { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; box-sizing: border-box; }
    body { background-color: var(--bg-base); color: #f4f4f5; overflow: hidden; height: 100vh; font-size: 14px; }

    /* Surfaces & Borders */
    .surface-panel { background-color: var(--bg-surface); border: 1px solid var(--border-hairline); }
    .surface-card { background-color: var(--bg-elevated); border: 1px solid var(--border-hairline); transition: border-color 0.15s ease, box-shadow 0.15s ease; }
    .surface-card:hover { border-color: #52525b; }

    /* Dot Matrix Canvas */
    .canvas-grid {
      background-color: #09090b;
      background-image: radial-gradient(#27272a 1.25px, transparent 1.25px);
      background-size: 28px 28px;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

    /* Priority Badges */
    .pri-urgent { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.35); }
    .pri-high { background: rgba(249, 115, 22, 0.15); color: #fdba74; border: 1px solid rgba(249, 115, 22, 0.35); }
    .pri-medium { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border: 1px solid rgba(59, 130, 246, 0.35); }
    .pri-low { background: rgba(161, 161, 170, 0.15); color: #d4d4d8; border: 1px solid rgba(161, 161, 170, 0.35); }

    .st-todo { color: #a1a1aa; }
    .st-in_progress { color: #60a5fa; }
    .st-review { color: #fbbf24; }
    .st-done { color: #34d399; }

    /* Map Node Styles */
    .map-node {
      position: absolute;
      width: 280px;
      user-select: none;
      cursor: grab;
      z-index: 10;
    }
    .map-node:active { cursor: grabbing; z-index: 30; }
    .map-node.connect-source { border-color: #6366f1 !important; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.45); }

    .edge-path { fill: none; stroke-width: 2.5; transition: stroke 0.2s, stroke-width 0.2s; pointer-events: stroke; cursor: pointer; }
    .edge-path:hover { stroke: #f43f5e !important; stroke-width: 4.5; }

    .dropzone-active { border-color: #6366f1 !important; background-color: rgba(99, 102, 241, 0.08) !important; }
  </style>
</head>
<body class="flex flex-col select-none">

  <!-- Top Navigation Header -->
  <header class="h-14 border-b border-zinc-800 bg-[#09090b] px-5 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-3.5">
      <!-- Logo -> Workspace Hub -->
      <div onclick="goToWorkspaceHub()" class="flex items-center gap-2.5 cursor-pointer group" title="내 워크스페이스 허브로 이동">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white text-sm font-bold shadow-sm group-hover:bg-indigo-500 transition">
          <i class="fa-solid fa-layer-group"></i>
        </div>
        <span class="font-bold text-base tracking-tight text-zinc-100 group-hover:text-indigo-400 transition">TeamFlow</span>
      </div>

      <span id="headerDivider" class="text-zinc-700 text-sm hidden">/</span>

      <!-- Active Project Switcher & Main Tabs -->
      <div id="headerProjectArea" class="items-center gap-4 hidden">
        <button onclick="goToWorkspaceHub()" class="flex items-center gap-2 text-sm font-semibold text-zinc-200 px-3 py-1.5 rounded-lg bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 transition">
          <span id="headerProjectTitle">프로젝트</span>
          <i class="fa-solid fa-chevron-down text-[11px] text-zinc-500"></i>
        </button>

        <nav class="flex items-center bg-zinc-900 p-1 rounded-xl border border-zinc-800">
          <button onclick="switchView('map')" id="tabBtn-map" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-diagram-project text-xs"></i> 워크플로우 맵
          </button>
          <button onclick="switchView('kanban')" id="tabBtn-kanban" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-solid fa-table-columns text-xs"></i> 칸반 보드
          </button>
          <button onclick="switchView('docs')" id="tabBtn-docs" class="px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2">
            <i class="fa-regular fa-file-lines text-xs"></i> 팀 문서 & 공지
          </button>
        </nav>
      </div>
    </div>

    <!-- Right Controls -->
    <div id="headerActions" class="items-center gap-2.5 hidden">
      <div class="hidden lg:flex items-center gap-2.5 px-3 py-1.5 rounded-lg bg-zinc-900 border border-zinc-800 text-xs">
        <span class="text-zinc-400">전체 달성률</span>
        <span id="headerProgressText" class="font-mono font-bold text-emerald-400 text-sm">0%</span>
        <div class="w-16 h-2 bg-zinc-800 rounded-full overflow-hidden">
          <div id="headerProgressBar" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </div>

      <button onclick="openCreateTaskModal()" class="px-3.5 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white transition flex items-center gap-1.5 shadow-sm">
        <i class="fa-solid fa-plus text-xs"></i> 새 업무
      </button>

      <button onclick="openInviteModal()" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-800 transition flex items-center gap-1.5">
        <i class="fa-solid fa-user-plus text-xs text-zinc-400"></i> 초대
      </button>

      <button onclick="toggleChatDrawer()" id="chatToggleBtn" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-zinc-900 hover:bg-zinc-800 text-zinc-200 border border-zinc-800 transition flex items-center gap-1.5 relative">
        <i class="fa-regular fa-comment-dots text-indigo-400"></i> 채널 채팅
        <span id="chatUnreadDot" class="w-2 h-2 rounded-full bg-rose-500 absolute top-1 right-1 hidden"></span>
      </button>

      <div class="h-4 w-[1px] bg-zinc-800 mx-0.5"></div>

      <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-zinc-900/70 border border-zinc-800 text-sm text-zinc-200">
        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
        <span id="currentUserName" class="font-medium">멤버</span>
      </div>
    </div>
  </header>

  <!-- Main Workspace Area + Discord-style Multi-Channel Chat Drawer -->
  <div class="flex-1 flex overflow-hidden relative">
    <!-- Primary Viewport -->
    <main id="appContainer" class="flex-1 flex flex-col overflow-hidden relative"></main>

    <!-- Right Collapsible Chat Drawer (Discord Style Channels + DMs) -->
    <aside id="chatDrawer" class="w-[460px] border-l border-zinc-800 bg-[#0c0c0f] flex-row shrink-0 hidden z-30 shadow-2xl">
      <!-- Left Channel & DM Sidebar -->
      <div class="w-40 border-r border-zinc-800/90 bg-[#09090b] flex flex-col shrink-0">
        <div class="p-3 border-b border-zinc-800 flex items-center justify-between">
          <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">토픽 채널</span>
          <button onclick="handleCreateChannel()" class="text-zinc-400 hover:text-white text-xs" title="새 채널 만들기">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>
        <div id="chatChannelsList" class="p-2 space-y-1 overflow-y-auto max-h-48"></div>

        <div class="p-3 border-t border-b border-zinc-800 flex items-center justify-between mt-2">
          <span class="text-xs font-bold text-zinc-400 uppercase tracking-wider">팀원 DM / 그룹</span>
        </div>
        <div id="chatDmMembersList" class="p-2 space-y-1 flex-1 overflow-y-auto"></div>
      </div>

      <!-- Right Active Chat Room -->
      <div class="flex-1 flex flex-col bg-[#0c0c0f] overflow-hidden">
        <div class="h-12 px-4 border-b border-zinc-800 flex items-center justify-between shrink-0">
          <div class="flex items-center gap-2 truncate">
            <span id="activeChatRoomTitle" class="text-sm font-bold text-white truncate"># 일반</span>
          </div>
          <button onclick="toggleChatDrawer()" class="text-zinc-500 hover:text-zinc-200 text-sm">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div id="chatMessagesList" class="flex-1 overflow-y-auto p-3.5 space-y-3 select-text"></div>

        <!-- Referenced Task Banner -->
        <div id="chatTaskRefBanner" class="px-3.5 py-2 bg-indigo-950/50 border-t border-indigo-500/30 hidden items-center justify-between text-xs text-indigo-300">
          <span id="chatTaskRefText" class="truncate"></span>
          <button onclick="clearChatTaskRef()" class="text-indigo-400 hover:text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <form onsubmit="handleSendMessage(event)" class="p-3 border-t border-zinc-800 bg-[#09090b] flex gap-2">
          <input type="text" id="chatInput" placeholder="메시지 보내기..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-2 text-sm text-zinc-100 focus:outline-none focus:border-indigo-500">
          <button type="submit" class="px-3.5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium transition">
            <i class="fa-solid fa-paper-plane text-xs"></i>
          </button>
        </form>
      </div>
    </aside>
  </div>

  <!-- ==========================================
       MODALS (Create Task / Task Detail / Invite)
  =========================================== -->

  <!-- 1. Create Task Modal (With Staged File Queue & Links) -->
  <div id="createTaskModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="surface-panel w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden max-h-[92vh] flex flex-col">
      <div class="px-6 py-4 border-b border-zinc-800 flex items-center justify-between">
        <h3 class="text-base font-bold text-zinc-100 flex items-center gap-2">
          <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span> 새 업무 생성
        </h3>
        <button onclick="closeModal('createTaskModal')" class="text-zinc-500 hover:text-zinc-200"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form onsubmit="handleCreateTask(event)" class="p-6 space-y-4 overflow-y-auto flex-1">
        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1.5">업무 제목 *</label>
          <input type="text" id="taskTitleInput" required placeholder="예: 결제 모듈 API 연동 / 시장조사 리포트 작성" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm font-medium text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-zinc-400 mb-1.5">상세 설명 & 메모</label>
          <textarea id="taskDescInput" rows="3" placeholder="업무 요구사항, 배경 맥락, 참고 메모를 자유롭게 적어주세요..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">담당자</label>
            <select id="taskAssigneeSelect" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500">
              <option value="">미정</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">우선순위</label>
            <select id="taskPrioritySelect" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500">
              <option value="medium">보통</option>
              <option value="urgent">긴급</option>
              <option value="high">높음</option>
              <option value="low">낮음</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">라벨 (카테고리)</label>
            <input type="text" id="taskLabelInput" placeholder="기획, 개발, 디자인..." value="일반" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">마감 기한</label>
            <input type="date" id="taskDueDateInput" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-2 text-sm text-zinc-200 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <!-- Attachments during Creation (Staged Files & Links) -->
        <div class="p-4 rounded-xl bg-zinc-900/60 border border-zinc-800/90 space-y-3">
          <div class="text-xs font-semibold text-zinc-300 flex items-center justify-between">
            <span><i class="fa-solid fa-paperclip text-indigo-400 mr-1.5"></i>초기 첨부 파일 & 참고 링크 (선택)</span>
            <span class="text-[11px] text-zinc-500">여러 폴더의 파일을 하나씩 대기열에 추가 가능</span>
          </div>

          <!-- File Queue Selector -->
          <div class="flex items-center gap-2">
            <label class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium cursor-pointer border border-zinc-700 transition">
              <i class="fa-solid fa-folder-open mr-1.5 text-indigo-400"></i>+ 파일 선택하여 대기열 추가
              <input type="file" multiple onchange="handleStageCreationFiles(event)" class="hidden">
            </label>
          </div>
          <div id="createStagedFilesList" class="space-y-1.5"></div>

          <!-- Link Queue Selector -->
          <div class="flex gap-2 pt-1">
            <input type="text" id="createLinkTitleInput" placeholder="링크 제목 (예: 피그마 시안)" class="w-1/3 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-white">
            <input type="url" id="createLinkUrlInput" placeholder="https://..." class="flex-1 bg-zinc-950 border border-zinc-800 rounded-lg px-3 py-1.5 text-xs text-white">
            <button type="button" onclick="handleStageCreationLink()" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs font-medium text-zinc-200 border border-zinc-700 whitespace-nowrap">
              + 링크 추가
            </button>
          </div>
          <div id="createStagedLinksList" class="space-y-1.5"></div>
        </div>

        <div class="pt-3 flex items-center justify-between border-t border-zinc-800">
          <label class="flex items-center gap-2 text-sm text-zinc-300 cursor-pointer">
            <input type="checkbox" id="taskPutInMapCheck" class="w-4 h-4 rounded bg-zinc-900 border-zinc-700 text-indigo-600 focus:ring-0">
            <span>생성 즉시 워크플로우 맵에 배치 (해제 시 트레이 보관)</span>
          </label>
          <div class="flex gap-2">
            <button type="button" onclick="closeModal('createTaskModal')" class="px-4 py-2 rounded-xl text-sm text-zinc-400 hover:text-zinc-200">취소</button>
            <button type="submit" id="createTaskSubmitBtn" class="px-5 py-2 rounded-xl text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-md">업무 등록</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 2. Task Detail Modal -->
  <div id="taskDetailModal" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="surface-panel w-full max-w-3xl rounded-2xl shadow-2xl max-h-[90vh] flex flex-col overflow-hidden select-text">
      <div class="px-6 py-4 border-b border-zinc-800 flex items-center justify-between bg-[#0c0c0f]">
        <div class="flex items-center gap-2.5">
          <span id="modalTaskLabelBadge" class="px-2.5 py-1 rounded-md text-xs font-semibold bg-zinc-800 text-zinc-200 border border-zinc-700">일반</span>
          <span id="modalTaskPriorityBadge" class="px-2.5 py-1 rounded-md text-xs font-semibold">보통</span>
          <button onclick="shareActiveTaskToChat()" class="px-2.5 py-1 rounded-md text-xs font-medium bg-indigo-500/15 text-indigo-300 hover:bg-indigo-500/25 border border-indigo-500/30 transition flex items-center gap-1.5">
            <i class="fa-regular fa-paper-plane text-[11px]"></i> 채팅에 공유
          </button>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="handleDeleteTask()" class="text-sm text-zinc-500 hover:text-rose-400 px-2.5 py-1 transition" title="업무 삭제">
            <i class="fa-regular fa-trash-can"></i> 삭제
          </button>
          <button onclick="closeModal('taskDetailModal')" class="text-zinc-500 hover:text-zinc-200 px-1.5"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>
      </div>

      <div class="flex-1 overflow-y-auto p-6 space-y-6">
        <div>
          <h2 id="modalTaskTitle" class="text-xl font-bold text-white tracking-tight mb-2.5"></h2>
          <p id="modalTaskDesc" class="text-sm text-zinc-300 leading-relaxed whitespace-pre-wrap bg-zinc-900/60 p-4 rounded-xl border border-zinc-800"></p>
        </div>

        <!-- Properties Grid -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 p-3.5 rounded-xl bg-[#0c0c0f] border border-zinc-800 text-sm">
          <div>
            <span class="text-xs text-zinc-500 block mb-1">진행 상태</span>
            <select id="modalStatusSelect" onchange="handleTaskFieldUpdate('status', this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-sm text-zinc-100">
              <option value="todo">대기 (Todo)</option>
              <option value="in_progress">진행 중 (In Progress)</option>
              <option value="review">검토 요청 (Review)</option>
              <option value="done">완료됨 (Done)</option>
            </select>
          </div>
          <div>
            <span class="text-xs text-zinc-500 block mb-1">담당자</span>
            <select id="modalAssigneeSelect" onchange="handleTaskFieldUpdate('assignee_name', this.value || null)" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-sm text-zinc-100">
              <option value="">미정</option>
            </select>
          </div>
          <div>
            <span class="text-xs text-zinc-500 block mb-1">우선순위</span>
            <select id="modalPrioritySelect" onchange="handleTaskFieldUpdate('priority', this.value)" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-2.5 py-1.5 text-sm text-zinc-100">
              <option value="urgent">긴급</option>
              <option value="high">높음</option>
              <option value="medium">보통</option>
              <option value="low">낮음</option>
            </select>
          </div>
          <div>
            <span class="text-xs text-zinc-500 block mb-1">맵 캔버스 상태</span>
            <button id="modalMapToggleBtn" onclick="toggleActiveTaskInMap()" class="w-full px-2.5 py-1.5 rounded-lg text-xs font-semibold border transition"></button>
          </div>
        </div>

        <!-- Sub-Checklist -->
        <div class="space-y-2.5">
          <div class="flex items-center justify-between">
            <h4 class="text-sm font-bold text-zinc-200 flex items-center gap-2">
              <i class="fa-solid fa-list-check text-indigo-400"></i> 세부 체크리스트
            </h4>
            <button onclick="toggleChecklistInput()" class="text-xs font-semibold text-indigo-400 hover:text-indigo-300">+ 항목 추가</button>
          </div>

          <form id="checklistAddForm" onsubmit="handleAddChecklistItem(event)" class="hidden gap-2">
            <input type="text" id="checklistInput" placeholder="할 일 입력 후 엔터..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-indigo-500">
            <button type="submit" class="px-3.5 py-1.5 rounded-lg bg-indigo-600 text-white text-xs font-semibold">추가</button>
          </form>

          <div id="modalChecklistContainer" class="space-y-1.5"></div>
        </div>

        <!-- Staged Queue File Upload & Links -->
        <div class="space-y-3 pt-4 border-t border-zinc-800">
          <div class="flex items-center justify-between">
            <h4 class="text-sm font-bold text-zinc-200 flex items-center gap-2">
              <i class="fa-solid fa-paperclip text-indigo-400"></i> 산출물 파일 & 레퍼런스 링크
            </h4>
            <span class="text-xs text-zinc-500">서로 다른 폴더의 파일을 대기열에 모아서 한 번에 업로드하세요</span>
          </div>

          <div class="p-4 rounded-xl bg-[#0c0c0f] border border-zinc-800 space-y-3">

  <script>
    // ==========================================

    const SUPABASE_URL = 'https://etpkmddranmbseymkllb.supabase.co'; 
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV0cGttZGRyYW5tYnNleW1rbGxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI4NjMxNDksImV4cCI6MjEwODQzOTE0OX0.4NbOzaf3vw-VTg9YOciYj_UmmKTmnMDs_CtlX6pK4t8';
    const sbClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    localStorage.setItem('teamflow_user_id', currentUserId);

    let currentView = 'map'; // 'map' | 'kanban' | 'docs'
    let kanbanOnlyMine = true; // #9: 내 업무만 보기 기본값
    let isChatOpen = false;

    let creationStagedFiles = [];
    let creationStagedLinks = [];
    let detailStagedFiles = [];

    // Map Interaction State
    let isConnectMode = false;

    let draggingTaskId = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;

    // Multi-Workspace Local Registry (#8)
    function getSavedWorkspaces() {
      try { return JSON.parse(localStorage.getItem('teamflow_workspaces') || '[]'); } catch { return []; }
    }
    function saveWorkspaceToLocal(proj) {
      if (!proj || !proj.id) return;
      const list = getSavedWorkspaces().filter(w => w.id !== proj.id);
      list.unshift({ id: proj.id, title: proj.title, role: proj.leader_name === currentUserName ? '리더' : '멤버', accessed_at: new Date().toLocaleDateString() });
      localStorage.setItem('teamflow_workspaces', JSON.stringify(list.slice(0, 20)));
    }
    function removeWorkspaceFromLocal(id) {
      const list = getSavedWorkspaces().filter(w => w.id !== id);
      localStorage.setItem('teamflow_workspaces', JSON.stringify(list));
      renderWorkspaceHub();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (!currentProjectId) {
        renderWorkspaceHub();
      } else if (!currentUserName) {
        renderOnboarding();
      } else {
        await loadWorkspace();
        initRealtimeSubscription();
      }
    });

    function goToWorkspaceHub() {
      window.history.pushState({}, '', window.location.pathname);
      currentProjectId = null;
      renderWorkspaceHub();
    }

    // ==========================================
    // 1. MULTI-WORKSPACE HUB (#8) & ONBOARDING
    // ==========================================
    function renderWorkspaceHub() {
      document.getElementById('headerDivider').classList.add('hidden');
      document.getElementById('headerProjectArea').classList.add('hidden');
      document.getElementById('headerActions').classList.add('hidden');
      document.getElementById('chatDrawer').classList.add('hidden');

      const savedList = getSavedWorkspaces();
      const app = document.getElementById('appContainer');

      app.innerHTML = `
        <div class="flex-1 overflow-y-auto p-6 sm:p-12 canvas-grid select-text">
          <div class="max-w-5xl mx-auto space-y-8">
            <!-- Hero Header -->
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-zinc-800 pb-6">
              <div>
                <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-indigo-500/15 text-indigo-400 border border-indigo-500/30">All-in-One Workspace</span>
                <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight mt-2">워크스페이스 관리 허브</h1>
                <p class="text-sm text-zinc-400 mt-1">스타트업 스프린트, 프로덕트 TF, 대학 프로젝트까지 한 곳에서 전환하고 관리하세요.</p>
              </div>
              ${currentUserName ? `
                <div class="flex items-center gap-2 bg-zinc-900 px-3.5 py-2 rounded-xl border border-zinc-800 text-sm">
                  <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                  <span class="text-zinc-300 font-medium">${escapeHTML(currentUserName)}</span>
                  <button onclick="handleChangeGlobalUserName()" class="text-xs text-indigo-400 hover:underline ml-1">이름 변경</button>
                </div>
              ` : ''}
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
              <!-- Left: My Recent Workspaces -->
              <div class="lg:col-span-2 space-y-4">
                <div class="flex items-center justify-between">
                  <h2 class="text-base font-bold text-zinc-100 flex items-center gap-2">
                    <i class="fa-solid fa-layer-group text-indigo-400 text-sm"></i> 내가 참여 중인 프로젝트 (${savedList.length})
                  </h2>
                </div>

                ${savedList.length === 0 ? `
                  <div class="surface-panel rounded-2xl p-10 text-center space-y-2">
                    <div class="text-zinc-400 text-sm font-medium">아직 최근 접속한 프로젝트가 없습니다.</div>
                    <div class="text-zinc-500 text-xs">우측 패널에서 새 워크스페이스를 개설하거나 초대 코드로 입장하세요.</div>
                  </div>
                ` : `
                  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                    ${savedList.map(w => `
                      <div onclick="window.location.search = '?p=${w.id}'" class="surface-card rounded-2xl p-5 cursor-pointer flex flex-col justify-between gap-4 group">
                        <div class="flex items-start justify-between gap-2">
                          <div>
                            <span class="text-[11px] font-mono text-indigo-400 bg-indigo-500/10 px-2 py-0.5 rounded border border-indigo-500/20">${w.id}</span>
                            <h3 class="text-base font-bold text-white mt-2 group-hover:text-indigo-400 transition">${escapeHTML(w.title)}</h3>
                          </div>
                          <button onclick="event.stopPropagation(); removeWorkspaceFromLocal('${w.id}')" class="text-zinc-600 hover:text-rose-400 p-1" title="목록에서 제거">
                            <i class="fa-solid fa-xmark"></i>
                          </button>
                        </div>
                        <div class="flex items-center justify-between text-xs text-zinc-400 pt-3 border-t border-zinc-800/80">
                          <span>최근 접속: ${w.accessed_at || '-'}</span>
                          <span class="text-zinc-200 font-semibold group-hover:translate-x-0.5 transition">열기 →</span>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                `}

                <!-- Join by Code Box -->
                <div class="surface-panel rounded-2xl p-5 flex flex-col sm:flex-row items-center justify-between gap-3">
                  <div>
                    <h4 class="text-sm font-bold text-zinc-200">초대 코드로 워크스페이스 합류</h4>
                    <p class="text-xs text-zinc-400">전달받은 프로젝트 코드(예: tf-a1b2c3)나 전체 URL을 입력하세요.</p>
                  </div>
                  <form onsubmit="handleJoinByCode(event)" class="flex gap-2 w-full sm:w-auto">
                    <input type="text" id="joinCodeInput" required placeholder="tf-xxxxxx" class="bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2 text-sm text-white focus:outline-none focus:border-indigo-500 w-full sm:w-44 font-mono">
                    <button type="submit" class="px-4 py-2 rounded-xl bg-zinc-800 hover:bg-zinc-700 text-sm font-semibold text-white whitespace-nowrap">입장</button>
                  </form>
                </div>
              </div>

              <!-- Right: Create New Workspace Card -->
              <div class="surface-panel rounded-2xl p-6 shadow-2xl space-y-4">
                <div class="flex items-center gap-2.5">
                  <div class="w-8 h-8 rounded-lg bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400">
                    <i class="fa-solid fa-plus"></i>
                  </div>
                  <div>
                    <h3 class="text-base font-bold text-white">새 워크스페이스 개설</h3>
                    <p class="text-xs text-zinc-400">어떤 규모의 팀이나 프로젝트든 즉시 시작</p>
                  </div>
                </div>

                <form onsubmit="handleCreateProject(event)" class="space-y-4 pt-1">
                  <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1.5">프로젝트 / 워크스페이스 이름 *</label>
                    <input type="text" id="newProjectTitle" required placeholder="예: Q4 모바일 앱 런칭 TF / 캡스톤 2팀" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-zinc-300 mb-1.5">본인 이름 (닉네임 / 역할) *</label>
                    <input type="text" id="newProjectLeader" required value="${escapeHTML(currentUserName || '')}" placeholder="예: 최유겸 (PM / 팀장)" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                  </div>
                  <button type="submit" id="createProjectBtn" class="w-full py-3 rounded-xl text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-500 transition shadow-lg">
                    워크스페이스 생성하기 →
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function handleJoinByCode(e) {
      e.preventDefault();
      let raw = document.getElementById('joinCodeInput').value.trim();
      if (raw.includes('?p=')) raw = raw.split('?p=')[1].split('&')[0];
      if (raw) window.location.search = `?p=${raw}`;
    }

    function handleChangeGlobalUserName() {
      const next = prompt('변경할 이름(닉네임)을 입력하세요:', currentUserName || '');
      if (next && next.trim()) {
        currentUserName = next.trim();
        localStorage.setItem('teamflow_user_name', currentUserName);
        renderWorkspaceHub();
      }
    }

    async function handleCreateProject(e) {
      e.preventDefault();
      const btn = document.getElementById('createProjectBtn');
      btn.disabled = true;
      btn.textContent = '생성 중...';

      const title = document.getElementById('newProjectTitle').value.trim();
      const leaderName = document.getElementById('newProjectLeader').value.trim();
      const projectCode = 'tf-' + Math.random().toString(36).substring(2, 8);

      try {
        const { error: pErr } = await sbClient.from('projects').insert([{
          id: projectCode,
          title,
          leader_name: leaderName,
          channels: ['일반', '기획-논의', '제작-개발']
        }]);
        if (pErr) throw pErr;

        await sbClient.from('members').insert([{ project_id: projectCode, user_id: currentUserId, name: leaderName, role: '리더' }]);
        await sbClient.from('docs').insert([{
          project_id: projectCode,
          title: '📌 프로젝트 핵심 목표 & 공지사항 (고정됨)',
          category: '필수 공지',
          is_pinned: true,
          content: '■ 프로젝트 핵심 목표:\n\n■ 주요 일정 및 마일스톤:\n\n■ 협업 규칙 & 공용 링크:',
          agenda: [
            { text: '킥오프 미팅 및 목표 정렬', done: true },
            { text: '핵심 마일스톤 및 담당 파트 분배', done: false }
          ],
          updated_by: leaderName
        }]);

        currentUserName = leaderName;
        localStorage.setItem('teamflow_user_name', leaderName);
        saveWorkspaceToLocal({ id: projectCode, title, leader_name: leaderName });

        window.location.search = `?p=${projectCode}`;
      } catch (err) {
        showToast('생성 실패: ' + err.message, 'error');
        btn.disabled = false;
        btn.textContent = '워크스페이스 생성하기 →';
      }
    }

    function renderOnboarding() {
      const app = document.getElementById('appContainer');
      app.innerHTML = `
        <div class="flex-1 flex flex-col items-center justify-center p-6 canvas-grid">
          <div class="w-full max-w-md surface-panel rounded-2xl p-7 shadow-2xl">
            <h2 class="text-lg font-bold text-white mb-1">워크스페이스 멤버 합류</h2>
            <p class="text-sm text-zinc-400 mb-5">팀원들과 협업할 본인의 이름이나 직책을 입력해 주세요.</p>
            <form onsubmit="handleOnboardUser(event)" class="space-y-4">
              <input type="text" id="onboardNameInput" required placeholder="예: 김민수 (프론트엔드 / 디자인)" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
              <button type="submit" class="w-full py-2.5 rounded-xl text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-500 transition">워크스페이스 입장</button>
            </form>
          </div>
        </div>
      `;
    }

    async function handleOnboardUser(e) {
      e.preventDefault();
      const name = document.getElementById('onboardNameInput').value.trim();
      await sbClient.from('members').insert([{ project_id: currentProjectId, user_id: currentUserId, name, role: '멤버' }]);
      localStorage.setItem('teamflow_user_name', name);
      currentUserName = name;
      await loadWorkspace();
      initRealtimeSubscription();
    }

    // ==========================================
    // 2. LOAD WORKSPACE & REALTIME
    // ==========================================
    async function loadWorkspace() {
      try {
        const { data: proj, error } = await sbClient.from('projects').select('*').eq('id', currentProjectId).single();
        if (error || !proj) throw new Error('해당 워크스페이스를 찾을 수 없습니다.');
        currentProject = proj;
        saveWorkspaceToLocal(proj);

        const [memsRes, tasksRes, msgsRes, docsRes] = await Promise.all([
          sbClient.from('members').select('*').eq('project_id', currentProjectId),
          sbClient.from('tasks').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true }),
          sbClient.from('messages').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true }),
          sbClient.from('docs').select('*').eq('project_id', currentProjectId).order('is_pinned', { ascending: false }).order('updated_at', { ascending: false })
        ]);

        currentMembers = memsRes.data || [];
        currentTasks = tasksRes.data || [];
        currentMessages = msgsRes.data || [];
        currentDocs = docsRes.data || [];

        if (currentUserName && !currentMembers.some(m => m.name === currentUserName)) {
          await sbClient.from('members').insert([{ project_id: currentProjectId, user_id: currentUserId, name: currentUserName, role: '멤버' }]);
          const { data: m2 } = await sbClient.from('members').select('*').eq('project_id', currentProjectId);
          currentMembers = m2 || [];
        }

        document.getElementById('headerDivider').classList.remove('hidden');
        document.getElementById('headerProjectArea').classList.remove('hidden');
        document.getElementById('headerProjectArea').classList.add('flex');
        document.getElementById('headerActions').classList.remove('hidden');
        document.getElementById('headerActions').classList.add('flex');

        document.getElementById('currentUserName').textContent = currentUserName;
        updateTopBarStats();
        renderActiveViewport();
        renderChatDrawerUI();
      } catch (err) {
        showToast(err.message, 'error');
        setTimeout(() => goToWorkspaceHub(), 1500);
      }
    }

    function updateTopBarStats() {
      if (!currentProject) return;
      document.getElementById('headerProjectTitle').textContent = currentProject.title;

      const total = currentTasks.length;
      const done = currentTasks.filter(t => t.status === 'done').length;
      const pct = total === 0 ? 0 : Math.round((done / total) * 100);
      document.getElementById('headerProgressText').textContent = `${pct}%`;
      document.getElementById('headerProgressBar').style.width = `${pct}%`;

      ['map', 'kanban', 'docs'].forEach(v => {
        const btn = document.getElementById(`tabBtn-${v}`);
        if (v === currentView) {
          btn.className = 'px-3.5 py-1.5 rounded-lg text-sm font-semibold transition flex items-center gap-2 bg-indigo-600 text-white shadow-sm';
        } else {
          btn.className = 'px-3.5 py-1.5 rounded-lg text-sm font-medium transition flex items-center gap-2 text-zinc-400 hover:text-zinc-100';
        }
      });
    }

    function switchView(view) {
      currentView = view;
      updateTopBarStats();
      renderActiveViewport();
    }

    function renderActiveViewport() {
      if (currentView === 'map') renderWorkflowMapView();
      else if (currentView === 'kanban') renderKanbanBoardView();
      else if (currentView === 'docs') renderDocsWikiView();
    }

    function initRealtimeSubscription() {
      if (!sbClient || !currentProjectId) return;
      sbClient.channel(`tf-v2-${currentProjectId}`)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'tasks', filter: `project_id=eq.${currentProjectId}` }, async () => {
          const { data } = await sbClient.from('tasks').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true });
          currentTasks = data || [];
          updateTopBarStats();
          if (!draggingTaskId) renderActiveViewport();
          if (activeTask) {
            const found = currentTasks.find(t => String(t.id) === String(activeTask.id));
            if (found) { activeTask = found; renderTaskDetailModalContent(); }
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'messages', filter: `project_id=eq.${currentProjectId}` }, async () => {
          const { data } = await sbClient.from('messages').select('*').eq('project_id', currentProjectId).order('created_at', { ascending: true });
          currentMessages = data || [];
          renderChatDrawerUI();
          if (!isChatOpen) document.getElementById('chatUnreadDot').classList.remove('hidden');
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'docs', filter: `project_id=eq.${currentProjectId}` }, async () => {
          const { data } = await sbClient.from('docs').select('*').eq('project_id', currentProjectId).order('is_pinned', { ascending: false }).order('updated_at', { ascending: false });
          currentDocs = data || [];
          if (currentView === 'docs') renderDocsWikiView();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'projects', filter: `id=eq.${currentProjectId}` }, async (payload) => {
          if (payload.new) { currentProject = payload.new; updateTopBarStats(); renderChatDrawerUI(); }
        })
        .subscribe();
    }

    // ==========================================
    // 3. VIEW 1: WORKFLOW MAP + COLLISION AVOIDANCE + MINIMAP
    // ==========================================
    const NODE_WIDTH = 280;
    const NODE_HEIGHT = 128;
    const NODE_GAP = 20;

    // #6: 겹침 방지 알고리즘 (다른 노드와 겹치면 빈 공간으로 밀어냄)
    function findNonOverlappingPosition(targetX, targetY, excludeTaskId) {
      let x = Math.max(24, Math.round(targetX / 14) * 14);
      let y = Math.max(24, Math.round(targetY / 14) * 14);
      const others = currentTasks.filter(t => t.in_map && String(t.id) !== String(excludeTaskId));

      let guard = 0;
      while (guard < 60) {
        const hit = others.find(o => {
          const ox = o.pos_x || 120;
          const oy = o.pos_y || 120;
          return Math.abs(x - ox) < (NODE_WIDTH + NODE_GAP) && Math.abs(y - oy) < (NODE_HEIGHT + NODE_GAP);
        });
        if (!hit) break;
        x = (hit.pos_x || 120) + NODE_WIDTH + NODE_GAP;
        if (x > 1650) {
          x = 60;
          y += NODE_HEIGHT + NODE_GAP;
        }
        guard++;
      }
      return { x, y };
    }

    function renderMinimapNodes(mapTasks) {
      // Scale: 2400x1500 -> 192x120 (0.08)
      const scale = 0.08;
      return mapTasks.map(t => {
        const left = Math.round((t.pos_x || 120) * scale);
        const top = Math.round((t.pos_y || 120) * scale);
        const color = t.status === 'done' ? 'bg-emerald-500' : (t.status === 'in_progress' ? 'bg-blue-500' : 'bg-indigo-400');
        return `<div class="absolute ${color} rounded-xs" style="left:${left}px; top:${top}px; width:22px; height:10px;" title="${escapeHTML(t.title)}"></div>`;
      }).join('');
    }

    function updateMinimapViewport() {
      const vp = document.getElementById('mapCanvasViewport');
      const rect = document.getElementById('minimapViewportRect');
      if (!vp || !rect) return;
      const scale = 0.08;
      rect.style.left = `${Math.round(vp.scrollLeft * scale)}px`;
      rect.style.top = `${Math.round(vp.scrollTop * scale)}px`;
      rect.style.width = `${Math.min(192, Math.round(vp.clientWidth * scale))}px`;
      rect.style.height = `${Math.min(120, Math.round(vp.clientHeight * scale))}px`;
    }

    function handleMinimapClick(e) {
      const vp = document.getElementById('mapCanvasViewport');
      const box = document.getElementById('minimapBox');
      if (!vp || !box) return;
      const r = box.getBoundingClientRect();
      const clickX = (e.clientX - r.left) / 0.08;
      const clickY = (e.clientY - r.top) / 0.08;
      vp.scrollTo({ left: Math.max(0, clickX - vp.clientWidth / 2), top: Math.max(0, clickY - vp.clientHeight / 2), behavior: 'smooth' });
    }

    function fitCanvasToNodes() {
      const vp = document.getElementById('mapCanvasViewport');
      const mapTasks = currentTasks.filter(t => t.in_map);
      if (!vp || mapTasks.length === 0) return;
      const minX = Math.min(...mapTasks.map(t => t.pos_x || 120));
      const minY = Math.min(...mapTasks.map(t => t.pos_y || 120));
      vp.scrollTo({ left: Math.max(0, minX - 60), top: Math.max(0, minY - 60), behavior: 'smooth' });
    }

    function renderMapNodeHTML(task, mapTasks) {
      const x = task.pos_x || 120;
      const y = task.pos_y || 120;

      const parentTasks = mapTasks.filter(p => deps.some(d => String(d) === String(p.id)));

        review: '<i class="fa-solid fa-circle-exclamation st-review"></i>',
        done: '<i class="fa-solid fa-circle-check st-done"></i>'
      }[task.status] || '<i class="fa-regular fa-circle st-todo"></i>';

      const checkTotal = (task.checklist || []).length;
      const checkDone = (task.checklist || []).filter(c => c.done).length;

      return `
        <div id="node-${task.id}"
             style="left: ${x}px; top: ${y}px;"
             onmousedown="handleNodeMouseDown(event, '${task.id}')"
             onclick="handleNodeClick(event, '${task.id}')"
             ondblclick="openTaskDetailModal('${task.id}')"
             class="map-node surface-card rounded-2xl p-4 shadow-2xl ${isSource ? 'connect-source' : ''} ${task.status === 'done' ? 'border-emerald-500/50' : ''}">
          
          <div class="flex items-center justify-between gap-1.5 mb-2.5">
            <div class="flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded-md text-xs font-semibold pri-${task.priority || 'medium'}">${priMap[task.priority || 'medium']}</span>
              <span class="px-2 py-0.5 rounded-md text-xs bg-zinc-800 text-zinc-300 border border-zinc-700">${escapeHTML(task.label || '일반')}</span>
            </div>
            <div class="flex items-center gap-1">
              ${isBlocked && task.status !== 'done' ? `<span class="text-[11px] px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/30"><i class="fa-solid fa-lock text-[9px]"></i> 선행대기</span>` : ''}
              <button onclick="event.stopPropagation(); startConnectFromNode('${task.id}')" title="화살표 연결" class="w-6 h-6 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-indigo-400 flex items-center justify-center text-xs">
                <i class="fa-solid fa-share-nodes"></i>
              </button>
              <button onclick="event.stopPropagation(); removeTaskFromMapToTray('${task.id}')" title="트레이로 빼기 (연결 초기화)" class="w-6 h-6 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-amber-400 flex items-center justify-center text-xs">
                <i class="fa-solid fa-inbox"></i>
              </button>
              <button onclick="event.stopPropagation(); openTaskDetailModal('${task.id}')" title="상세 정보" class="w-6 h-6 rounded-lg hover:bg-zinc-800 text-zinc-400 hover:text-white flex items-center justify-center text-xs">
                <i class="fa-solid fa-expand"></i>
              </button>
            </div>
          </div>

          <div class="flex items-start gap-2 mb-3">
            <span class="text-sm mt-0.5">${stIcon}</span>
            <h4 class="text-sm font-bold text-zinc-100 leading-snug line-clamp-2 ${task.status === 'done' ? 'line-through text-zinc-500' : ''}">${escapeHTML(task.title)}</h4>
          </div>

          <div class="flex items-center justify-between pt-2.5 border-t border-zinc-800 text-xs text-zinc-400">
            <span class="truncate max-w-[130px] font-medium"><i class="fa-regular fa-user mr-1.5 text-zinc-500"></i>${escapeHTML(task.assignee_name || '미정')}</span>
            <div class="flex items-center gap-2.5 text-zinc-400">
              ${checkTotal > 0 ? `<span class="${checkDone === checkTotal ? 'text-emerald-400 font-semibold' : ''}"><i class="fa-solid fa-check-square mr-1"></i>${checkDone}/${checkTotal}</span>` : ''}
              ${(task.files?.length || 0) > 0 ? `<span><i class="fa-solid fa-paperclip mr-0.5"></i>${task.files.length}</span>` : ''}
              ${(task.comments?.length || 0) > 0 ? `<span><i class="fa-regular fa-comment mr-0.5"></i>${task.comments.length}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderMapSvgEdges(mapTasks) {
      let paths = '';
      mapTasks.forEach(target => {
        const deps = Array.isArray(target.dependencies) ? target.dependencies : [];
        deps.forEach(sourceId => {
          const source = mapTasks.find(t => String(t.id) === String(sourceId));
          if (!source) return;

          const x1 = (source.pos_x || 120) + NODE_WIDTH;
          const y1 = (source.pos_y || 120) + (NODE_HEIGHT / 2);
          const x2 = (target.pos_x || 120);
          const y2 = (target.pos_y || 120) + (NODE_HEIGHT / 2);

          const dx = Math.max(Math.abs(x2 - x1) * 0.5, 60);
          const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;
          const isDone = source.status === 'done';

          paths += `
            <path d="${d}" 
                  class="edge-path"
                  stroke="${isDone ? '#10b981' : '#6366f1'}" 
                  stroke-dasharray="${isDone ? '0' : '6,6'}"
                  marker-end="url(#${isDone ? 'arrow-done' : 'arrow-wait'})"
                  onclick="handleRemoveDependency('${target.id}', '${source.id}')">
              <title>클릭하여 화살표 연결 해제</title>
            </path>
          `;
        });
      });
      return paths;
    }

    function handleNodeMouseDown(e, taskId) {
      if (e.button !== 0 || isConnectMode || e.shiftKey) return;
      const nodeEl = document.getElementById(`node-${taskId}`);
      if (!nodeEl) return;
      draggingTaskId = taskId;
      const rect = nodeEl.getBoundingClientRect();
      dragOffsetX = e.clientX - rect.left;
      dragOffsetY = e.clientY - rect.top;
    }

    function handleCanvasMouseMove(e) {
      if (!draggingTaskId) return;
      const surface = document.getElementById('mapCanvasSurface');
      const nodeEl = document.getElementById(`node-${draggingTaskId}`);
      if (!surface || !nodeEl) return;

      const surfRect = surface.getBoundingClientRect();
      const rawX = Math.max(20, Math.round(e.clientX - surfRect.left - dragOffsetX));
      const rawY = Math.max(20, Math.round(e.clientY - surfRect.top - dragOffsetY));

      nodeEl.style.left = `${rawX}px`;
      nodeEl.style.top = `${rawY}px`;

      const task = currentTasks.find(t => String(t.id) === String(draggingTaskId));
      if (task) {
        task.pos_x = rawX;
        task.pos_y = rawY;
        const svg = document.getElementById('mapEdgesSvg');
        if (svg) {
          const mapTasks = currentTasks.filter(t => t.in_map);
          svg.innerHTML = `
            <defs>
              <marker id="arrow-done" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" /></marker>
              <marker id="arrow-wait" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 10 5 L 0 9 z" fill="#6366f1" /></marker>
            </defs>
            ${renderMapSvgEdges(mapTasks)}
          `;
        }
      }
    }

    async function handleCanvasMouseUp() {
      if (!draggingTaskId) return;
      const movedId = draggingTaskId;
      draggingTaskId = null;

      const task = currentTasks.find(t => String(t.id) === String(movedId));
      if (task) {
        // #6: 마우스를 놓는 순간 다른 카드와 겹쳐 있으면 자동으로 빈 자리로 밀어냄
        const safePos = findNonOverlappingPosition(task.pos_x, task.pos_y, task.id);
        task.pos_x = safePos.x;
        task.pos_y = safePos.y;
        renderWorkflowMapView();
        if (sbClient) {
          await sbClient.from('tasks').update({ pos_x: safePos.x, pos_y: safePos.y }).eq('id', task.id);
        }
      }
    }

    function toggleConnectMode() {
      isConnectMode = !isConnectMode;
      connectSourceTaskId = null;
      renderWorkflowMapView();
    }

    function startConnectFromNode(taskId) {
      isConnectMode = true;
      connectSourceTaskId = taskId;
      renderWorkflowMapView();
      showToast('연결할 후행 업무 카드를 클릭하세요.');
    }

    async function handleNodeClick(e, taskId) {
      if (!isConnectMode && !e.shiftKey) return;
      e.stopPropagation();

      if (!connectSourceTaskId) {
        connectSourceTaskId = taskId;
        renderWorkflowMapView();
        return;
      }
      if (String(connectSourceTaskId) === String(taskId)) {
        connectSourceTaskId = null;
        renderWorkflowMapView();
        return;
      }

      const targetTask = currentTasks.find(t => String(t.id) === String(taskId));
      if (targetTask) {
        const deps = Array.isArray(targetTask.dependencies) ? [...targetTask.dependencies] : [];
        if (!deps.some(d => String(d) === String(connectSourceTaskId))) {
          deps.push(connectSourceTaskId);
          targetTask.dependencies = deps;
          await sbClient.from('tasks').update({ dependencies: deps }).eq('id', targetTask.id);
          showToast('선후 화살표가 연결되었습니다.');
        }
      }
      connectSourceTaskId = null;
      isConnectMode = false;
      renderWorkflowMapView();
    }

    async function handleRemoveDependency(targetId, sourceId) {
      const target = currentTasks.find(t => String(t.id) === String(targetId));
      if (!target) return;
      const deps = (target.dependencies || []).filter(d => String(d) !== String(sourceId));
      target.dependencies = deps;
      renderWorkflowMapView();
      await sbClient.from('tasks').update({ dependencies: deps }).eq('id', target.id);
      showToast('화살표 연결이 해제되었습니다.');
    }

    async function placeTaskOnMap(taskId) {
      const task = currentTasks.find(t => String(t.id) === String(taskId));
      if (!task) return;
      const safePos = findNonOverlappingPosition(100, 100, task.id);

      task.in_map = true;
      task.pos_x = safePos.x;
      task.pos_y = safePos.y;
      task.dependencies = []; // #7: 새로 꺼낼 때 깨끗한 상태 보장
      renderWorkflowMapView();
      await sbClient.from('tasks').update({ in_map: true, pos_x: safePos.x, pos_y: safePos.y, dependencies: [] }).eq('id', task.id);
    }

    // #7: 트레이로 복귀 시 본인의 선행 화살표 + 다른 업무가 이 업무를 가리키던 화살표 모두 완전 초기화
    async function removeTaskFromMapToTray(taskId) {
      const task = currentTasks.find(t => String(t.id) === String(taskId));
      if (!task) return;
      task.in_map = false;
      task.dependencies = [];

      const affected = currentTasks.filter(t => Array.isArray(t.dependencies) && t.dependencies.some(d => String(d) === String(taskId)));
      for (const other of affected) {
        other.dependencies = other.dependencies.filter(d => String(d) !== String(taskId));
        await sbClient.from('tasks').update({ dependencies: other.dependencies }).eq('id', other.id);
      }

      await sbClient.from('tasks').update({ in_map: false, dependencies: [] }).eq('id', task.id);
      renderActiveViewport();
      showToast('트레이로 이동하며 기존 화살표 연결이 초기화되었습니다.');
    }

    // ==========================================
    // 4. VIEW 2: PERSONALIZED KANBAN BOARD (#9)
    // ==========================================
    function toggleKanbanFilter(onlyMine) {
      kanbanOnlyMine = onlyMine;
      renderKanbanBoardView();
    }

    function renderKanbanBoardView() {
      const app = document.getElementById('appContainer');
      const cols = [
        { key: 'todo', title: '대기 (Todo)', dot: 'bg-zinc-400' },
        { key: 'in_progress', title: '진행 중 (In Progress)', dot: 'bg-blue-500' },
        { key: 'review', title: '검토 요청 (Review)', dot: 'bg-amber-500' },
        { key: 'done', title: '완료됨 (Done)', dot: 'bg-emerald-500' }
      ];

      const filteredTasks = kanbanOnlyMine
        ? currentTasks.filter(t => t.assignee_name === currentUserName)
        : currentTasks;

      const myCount = currentTasks.filter(t => t.assignee_name === currentUserName).length;

      app.innerHTML = `
        <div class="flex-1 flex flex-col overflow-hidden bg-[#09090b] p-6">

              ${cols.map(c => {
                const list = filteredTasks.filter(t => t.status === c.key);
                return `
                  <div class="surface-panel rounded-2xl flex flex-col h-full overflow-hidden">
                    <div class="px-4 py-3.5 border-b border-zinc-800 flex items-center justify-between">
                      <div class="flex items-center gap-2">
                        <span class="w-2.5 h-2.5 rounded-full ${c.dot}"></span>

    function renderKanbanCard(task) {
      const priMap = { urgent: '긴급', high: '높음', medium: '보통', low: '낮음' };
      const checkTotal = (task.checklist || []).length;
      const checkDone = (task.checklist || []).filter(c => c.done).length;

      return `
        <div onclick="openTaskDetailModal('${task.id}')" class="surface-card rounded-xl p-4 cursor-pointer space-y-2.5">
          <div class="flex items-center justify-between gap-1.5">
            <div class="flex items-center gap-1.5">
              <span class="px-2 py-0.5 rounded-md text-xs font-semibold pri-${task.priority || 'medium'}">${priMap[task.priority || 'medium']}</span>
              <span class="px-2 py-0.5 rounded-md text-xs bg-zinc-800 text-zinc-300">${escapeHTML(task.label || '일반')}</span>
            </div>
            ${task.in_map ? `<span class="text-xs text-indigo-400" title="워크플로우 맵에 배치됨"><i class="fa-solid fa-diagram-project"></i></span>` : ''}
          </div>
          <h4 class="text-sm font-bold text-zinc-100 leading-snug">${escapeHTML(task.title)}</h4>
          <div class="flex items-center justify-between pt-2.5 border-t border-zinc-800 text-xs text-zinc-400">
            <span><i class="fa-regular fa-user mr-1 text-zinc-500"></i>${escapeHTML(task.assignee_name || '미정')}</span>
            <div class="flex items-center gap-2 text-zinc-400">
              ${task.due_date ? `<span class="font-mono">${task.due_date.slice(5)}</span>` : ''}
              ${checkTotal > 0 ? `<span><i class="fa-solid fa-check-square mr-0.5"></i>${checkDone}/${checkTotal}</span>` : ''}
            </div>
          </div>
        </div>
      `;
    }

      app.innerHTML = `

          <div id="docsSidebarDropzone"
               ondragover="handleDocDragOver(event)"
               ondragleave="handleDocDragLeave(event)"

            <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
              <span class="text-sm font-bold text-zinc-100">팀 공유 문서 & 공지함</span>

            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-1.5">
              ${currentDocs.map(d => `
                <div onclick="selectDoc('${d.id}')" class="p-3 rounded-xl cursor-pointer transition flex items-start justify-between gap-2 ${String(d.id) === String(activeDocId) ? 'bg-zinc-800 text-white border border-zinc-700' : 'text-zinc-400 hover:bg-zinc-900 hover:text-zinc-200'}">
                  <div class="truncate">
                    <div class="flex items-center gap-1.5">
                      ${d.is_pinned ? `<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 text-[10px] font-bold">📌 공지</span>` : ''}
                      <span class="text-sm font-semibold truncate">${escapeHTML(d.title)}</span>
                    </div>
                    <div class="text-xs text-zinc-500 mt-1">${escapeHTML(d.category || '일반 문서')} · ${escapeHTML(d.updated_by || '')}</div>

              `).join('')}
            </div>
          </div>

          <div class="flex-1 flex flex-col overflow-y-auto p-6 sm:p-8">

              <div class="flex-1 flex items-center justify-center text-sm text-zinc-500">좌측에서 문서를 선택하거나 파일을 드래그해 등록하세요.</div>
            ` : `
              <div class="max-w-4xl w-full mx-auto flex-1 flex flex-col space-y-4">

                  <div class="flex items-center gap-2">

                    <button onclick="handleTogglePinDoc('${activeDoc.id}')" class="px-3 py-1.5 rounded-lg text-xs font-semibold border transition ${activeDoc.is_pinned ? 'bg-amber-500/15 text-amber-300 border-amber-500/30' : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:text-white'}">
                      📌 ${activeDoc.is_pinned ? '상단 공지 고정됨' : '공지로 상단 고정'}
                    </button>
                  </div>
                  <div class="flex items-center gap-2">
                    <button onclick="handleSaveDoc('${activeDoc.id}')" class="px-4 py-1.5 rounded-lg text-sm font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow">저장하기</button>
                    <button onclick="handleDeleteDoc('${activeDoc.id}')" class="px-3 py-1.5 rounded-lg text-sm text-zinc-500 hover:text-rose-400"><i class="fa-regular fa-trash-can"></i></button>

                </div>

                <input type="text" id="docTitleInput" value="${escapeHTML(activeDoc.title)}" placeholder="문서 제목을 입력하세요" class="text-2xl font-bold text-white bg-transparent focus:outline-none">

                <!-- Attached Doc Files -->
                ${(activeDoc.files && activeDoc.files.length > 0) ? `
                  <div class="flex flex-wrap gap-2 p-3 rounded-xl bg-zinc-900/70 border border-zinc-800">
                    ${activeDoc.files.map(f => `
                      <a href="${f.url}" target="_blank" class="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-xs text-indigo-300 flex items-center gap-1.5">
                        <i class="fa-regular fa-file"></i> ${escapeHTML(f.name)}
                      </a>
                    `).join('')}
                  </div>
                ` : ''}

                <textarea id="docContentInput" placeholder="회의록, 프로젝트 공지사항, 기획 스펙 등을 자유롭게 작성하세요..." class="flex-1 w-full bg-zinc-900/40 border border-zinc-800 rounded-2xl p-5 text-sm text-zinc-100 leading-relaxed focus:outline-none focus:border-zinc-700 resize-none min-h-[420px]">${escapeHTML(activeDoc.content || '')}</textarea>
